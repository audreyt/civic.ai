name = "civic-ai-ask"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# Uncomment when ask.civic.ai is a proxied DNS name in this CF account:
# [[routes]]
# pattern = "ask.civic.ai"
# custom_domain = true

[vars]
# "@cf/..." ids generate on the Workers AI binding ([ai]) — no gateway hop,
# so no CF_AIG_TOKEN is needed on this path. "nemotron-ultra" / "fugu" stream
# through AI Gateway instead and DO need CF_AIG_TOKEN (still set as a secret).
AUDREY_MODEL = "@cf/deepseek-ai/deepseek-v4-flash-0731"

[ai]
binding = "AI"

[[vectorize]]
binding = "SITE_VECTORIZE"
index_name = "civic-ai-site"

# Create index (once): wrangler vectorize create civic-ai-site --dimensions=1024 --metric=cosine
# Metadata index (once, BEFORE bulk upsert): wrangler vectorize create-metadata-index civic-ai-site --propertyName=lang --type=string
# Secret: CF_AIG_TOKEN only (wrangler secret put) — the Baseten credential is a
# stored AI Gateway provider key on the Cloudflare side.

[dev]
port = 8788
