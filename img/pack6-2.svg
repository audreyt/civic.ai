<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 6: Symbiosis — Solution</title><desc>Hand-lettered comic page headed 'NOT: a one-size-fits-all overlord, BUT: local solutions for local folks — SOLUTION' urging 'fight for the users', with three recent examples — the nonprofit ROOST.tools making open-source, un-centralised tools to detect and prevent child abuse; the open-source gpt-oss-safeguard that lets a community bring its own policy so it assists rather than replaces human moderators; and this book itself, made with a bounded local-spirit Kami fine-tuned to steward one specific relationship and run on one specific laptop — closing that sharing power, not concentrating it, is how we build the future.</desc><style>@font-face{font-family:"Patrick Hand SC";src:url(/fonts/patrick-hand-sc-comics.woff2) format("woff2");font-display:block}@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack6-2-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack6-2-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="426.3" letter-spacing="-7.9" fill="#000000"><text><tspan x="539.1" y="500.7">not: one-size-fits-all&#32;</tspan><tspan x="3872.2" y="500.7">overlord</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="424.3" letter-spacing="-7.1" fill="#000000"><text><tspan x="214" y="867.7">but: local solutions for local&#32;</tspan><tspan x="4749.6" y="867.7">folks</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="362" y="1658.3" font-size="416.8" textLength="1377" lengthAdjust="spacingAndGlyphs">SOLUTION:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="210.4" fill="#000000"><text><tspan x="1905.4" y="1550">Fight for&#32;</tspan><tspan x="2623" y="1550">the users! Demand tech&#32;</tspan><tspan x="4434.7" y="1550">that defends&#32;</tspan></text><text transform="matrix(1 0 -0.35 1 622.4 0)"><tspan x="1887.3" y="1778.2">local&#32;</tspan></text><text><tspan x="2342.6" y="1778.2">autonomy.&#32;</tspan><tspan x="3165.9" y="1778.2">Here&#32;</tspan><tspan x="3569.3" y="1778.2">are&#32;</tspan><tspan x="3869" y="1778.2">3&#32;</tspan><tspan x="4010.6" y="1778.2">recent examples...</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="2527.6" y="2220.4">&quot;Think&#32;</tspan><tspan x="3007.4" y="2220.4">about the children&quot;&#32;</tspan><tspan x="4351.7" y="2220.4">is the&#32;</tspan><tspan x="4779.7" y="2220.4">most&#32;</tspan><tspan x="2595.4" y="2432.4">common&#32;</tspan><tspan x="3213.8" y="2432.4">excuse&#32;</tspan><tspan x="3721.4" y="2432.4">for&#32;</tspan><tspan x="3984" y="2432.4">authoritarians&#32;</tspan><tspan x="5011.2" y="2432.4">to&#32;</tspan><tspan x="2594.2" y="2644.4">extend their reach. But&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 661.1 0)"><tspan x="4224.3" y="2644.4">ROOST.tools&#32;</tspan></text><text><tspan x="2589.4" y="2856.7">is a nonprofit&#32;</tspan><tspan x="3571.4" y="2856.7">that makes open-source&#32;</tspan><tspan x="2590.7" y="3057.4">tools --&#32;</tspan><tspan x="3176.1" y="3057.4">no centralised&#32;</tspan><tspan x="4196.6" y="3057.4">control! --&#32;</tspan><tspan x="4991" y="3057.4">to&#32;</tspan><tspan x="2589.2" y="3258.2">help orgs&#32;</tspan><tspan x="3277.3" y="3258.2">detect &amp;&#32;</tspan><tspan x="3898.7" y="3258.2">prevent child abuse&#32;</tspan><tspan x="2589.9" y="3459.7">on&#32;</tspan><tspan x="2796.5" y="3459.7">their platforms.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.5" fill="#000000"><text transform="matrix(1 0 -0.4 1 1624.4 0)"><tspan x="691.4 776.5 857.5 923.3 1001.6 1077.7 1151.4 1224.1 1301.4 1376.1 1451.2 1519.9 1596 1681.2 1757.8 1832.8 1905.5 1989.1" y="4061.1">gpt-oss-safeguard&#32;</tspan></text><text><tspan x="2068.1 2112 2186.7" y="4061.1">is&#32;</tspan><tspan x="2227.7 2303.7 2391.2" y="4061.1">an&#32;</tspan><tspan x="2433.2 2511.4 2592.3 2669.5 2754 2833.3 2906 2982.1 3059.7 3132.4 3207.6" y="4061.1">open-source&#32;</tspan><tspan x="688.4 781.8 826.8 870.9 936.7 1017.2 1092.2 1158.1 1202.1 1253.1 1327.3 1395.1 1468.8" y="4272.2">AI that lets&#32;</tspan><tspan x="1511.9 1592.9 1670 1746.6" y="4272.2">you&#32;</tspan><tspan x="1789.7 1868.6 1943.3 1985.2 2071.7 2156.9 2201 2281.9 2359.1 2435.7 2509.4 2553.5 2630.6 2719.3 2805.8" y="4272.2">bring your own&#32;</tspan><tspan x="2847.9 2929.8 3007 3057.9 3100.8 3175.1 3256.1" y="4272.2">policy.&#32;</tspan><tspan x="558.8" y="4482.8">Tell it&#32;</tspan><tspan x="1021.3" y="4482.8">your community’</tspan><tspan x="2168.7" y="4482.8">s&#32;</tspan><tspan x="2287.4" y="4482.8">rules &amp; values,&#32;</tspan><tspan x="730.2" y="4684">and it&#32;</tspan><tspan x="1162.3" y="4684">can assist (not&#32;</tspan><tspan x="2226.8" y="4684">replace)&#32;</tspan><tspan x="2847.9" y="4684">human&#32;</tspan><tspan x="405.3" y="4886.1">moderators in&#32;</tspan><tspan x="1419.3" y="4886.1">defending&#32;</tspan><tspan x="2133.1" y="4886.1">your community!</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="4286" y="4341.4" font-size="193.7" textLength="252" lengthAdjust="spacingAndGlyphs">Con&#32;</tspan><tspan x="4286" y="4478.7" font-size="155.8" textLength="264" lengthAdjust="spacingAndGlyphs">stitu&#32;</tspan><tspan x="4279" y="4650.3" font-size="157.9" textLength="260" lengthAdjust="spacingAndGlyphs">tion</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="150.1" fill="#000000"><text style="font-variant-ligatures:common-ligatures"><tspan x="2916.4" y="5685.6">And finally, this&#32;</tspan></text><text style="font-variant-ligatures:common-ligatures" transform="matrix(1 0 -0.2 1 1137.1 0)"><tspan x="3791.9" y="5685.6">book itself&#32;</tspan></text><text style="font-variant-ligatures:common-ligatures"><tspan x="2917" y="5897.3">benefited&#32;</tspan><tspan x="3429.6" y="5897.3">from&#32;</tspan><tspan x="3739.3" y="5897.3">a&#32;</tspan><tspan x="3831.7" y="5897.3">“local spirit” Kami:&#32;</tspan><tspan x="2917.2" y="6109.3">not corp-slop&#32;</tspan><tspan x="3689.1" y="6109.3">on the cloud, but a&#32;</tspan><tspan x="4703.3" y="6109.3">Kami&#32;</tspan><tspan x="2916.7" y="6321.3">stewarding&#32;</tspan></text><text style="font-variant-ligatures:common-ligatures" transform="matrix(1 0 -0.2 1 1264.3 0)"><tspan x="3554.3" y="6321.3">one specific relationship,&#32;</tspan></text><text style="font-variant-ligatures:common-ligatures"><tspan x="2917" y="6533.2">locally run&#32;</tspan><tspan x="3516.4" y="6533.2">on&#32;</tspan></text><text style="font-variant-ligatures:common-ligatures" transform="matrix(1 0 -0.2 1 1306.6 0)"><tspan x="3700.3" y="6533.2">one specific laptop.</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1406" y="5942" font-size="154.7" textLength="310" lengthAdjust="spacingAndGlyphs">CIVIC.AI&#32;</tspan><tspan x="1406" y="5993.6" font-size="61.1" textLength="290" lengthAdjust="spacingAndGlyphs">HOW TO KEEP AI&#32;</tspan><tspan x="1471" y="6105.3" font-size="75.8" textLength="215" lengthAdjust="spacingAndGlyphs">IN THE LOOP OF&#32;</tspan><tspan x="1480" y="6158.2" font-size="85.3" textLength="242" lengthAdjust="spacingAndGlyphs">HUMAN COMMUNITY&#32;</tspan><tspan x="1452" y="6206.1" font-size="76.8" textLength="245" lengthAdjust="spacingAndGlyphs">&amp; FLOURISHING</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="2905.8" y="6896.7">This principle,&#32;</tspan><tspan x="3928" y="6896.7">along with all&#32;</tspan><tspan x="4888.3" y="6896.7">the&#32;</tspan><tspan x="2905.9" y="7107.7">other&#32;</tspan><tspan x="3322.1" y="7107.7">principles in this&#32;</tspan><tspan x="4530" y="7107.7">book,&#32;</tspan><tspan x="589.2" y="7318.2">are how we can build a future&#32;</tspan><tspan x="2603.1" y="7318.2">that does not&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 2195.4 0)"><tspan x="3546.3" y="7318.2">concentrate&#32;</tspan></text><text><tspan x="4456.6" y="7318.2">power</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="194.6" fill="#000000"><text><tspan x="591.2 670.4 747.2 816.1" y="7521.3">but&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 1880.3 0)"><tspan x="855.9 930.8 1010.5 1086.7 1159.6 1235.1 1314" y="7521.3">shares&#32;</tspan></text><text><tspan x="1382.7 1464 1541.4 1629.5 1705.9 1783.8" y="7521.3">power&#32;</tspan><tspan x="1831.6 1904.8 2036.1 2112.5 2198.5 2289" y="7521.3">among&#32;</tspan><tspan x="2328.8 2410.1 2486.5 2563.9 2646.2 2695.9 2772.3" y="7521.3">people.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="3372.8" y="7520.6">Live long and prosper!</tspan></text></g></g></svg>
