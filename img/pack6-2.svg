<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 6: Symbiosis — Solution</title><desc>Hand-lettered comic page headed 'NOT: a one-size-fits-all overlord, BUT: local solutions for local folks — SOLUTION' urging 'fight for the users', with three recent examples — the nonprofit ROOST.tools making open-source, un-centralised tools to detect and prevent child abuse; the open-source gpt-oss-safeguard that lets a community bring its own policy so it assists rather than replaces human moderators; and this book itself, made with a bounded local-spirit Kami fine-tuned to steward one specific relationship and run on one specific laptop — closing that sharing power, not concentrating it, is how we build the future.</desc><style>@font-face{font-family:"Patrick Hand SC";src:url(/fonts/patrick-hand-sc-comics.woff2) format("woff2");font-display:block}@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack6-2-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack6-2-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="426.3" letter-spacing="-7.9" fill="#000000"><text><tspan x="539.1" y="500.7">not: one-size-fits-all&#32;</tspan><tspan x="3872.2" y="500.7">overlord</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="424.3" letter-spacing="-7.1" fill="#000000"><text><tspan x="214" y="867.7">but: local solutions for local&#32;</tspan><tspan x="4749.6" y="867.7">folks</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="362" y="1658.3" font-size="416.8" textLength="1377" lengthAdjust="spacingAndGlyphs">SOLUTION:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="210.3" fill="#000000"><text><tspan x="1904.4" y="1550">Fight for the users! Demand tech that defends&#32;</tspan></text><text transform="matrix(1 0 -0.35 1 622.2 0)"><tspan x="1886.3" y="1777.7">local&#32;</tspan></text><text><tspan x="2343.4" y="1777.7">autonomy.&#32;</tspan><tspan x="3166.2" y="1777.7">Here&#32;</tspan><tspan x="3569.4" y="1777.7">are&#32;</tspan><tspan x="3868.9" y="1777.7">3 recent examples...</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="2527.6" y="2220.4">&quot;Think&#32;</tspan><tspan x="3007.3" y="2220.4">about the children&quot; is the most&#32;</tspan><tspan x="2595.4" y="2432.4">common&#32;</tspan><tspan x="3213.7" y="2432.4">excuse&#32;</tspan><tspan x="3721.3" y="2432.4">for&#32;</tspan><tspan x="3983.9" y="2432.4">authoritarians&#32;</tspan><tspan x="5011" y="2432.4">to&#32;</tspan><tspan x="2594.2" y="2644.4">extend their reach. But&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 661.1 0)"><tspan x="4224.2" y="2644.4">ROOST.tools&#32;</tspan></text><text><tspan x="2589.4" y="2856.2">is a&#32;</tspan><tspan x="2868" y="2856.2">nonprofit that&#32;</tspan><tspan x="3902.4" y="2856.2">makes open-source&#32;</tspan><tspan x="2589.7" y="3057.4">tools --&#32;</tspan><tspan x="3176" y="3057.4">no centralised&#32;</tspan><tspan x="4196.4" y="3057.4">control! --&#32;</tspan><tspan x="4990.8" y="3057.4">to&#32;</tspan><tspan x="2589.2" y="3258.2">help orgs&#32;</tspan><tspan x="3277.2" y="3258.2">detect &amp;&#32;</tspan><tspan x="3898.6" y="3258.2">prevent child abuse&#32;</tspan><tspan x="2589.9" y="3459.7">on&#32;</tspan><tspan x="2796.5" y="3459.7">their platforms.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text transform="matrix(1 0 -0.4 1 1624.2 0)"><tspan x="690.4 775.5 856.4 922.2 999.5 1076.6 1150.3 1223.9 1301.2 1374.9 1449.9 1518.5 1594.7 1679.8 1756.3 1831.3 1905 1987.6" y="4060.6">gpt-oss-safeguard&#32;</tspan></text><text><tspan x="2067.6 2110.5 2186.1" y="4060.6">is&#32;</tspan><tspan x="2228.1 2303.1 2391.6" y="4060.6">an&#32;</tspan><tspan x="2433.6 2510.7 2592.6 2668.7 2755.2 2831.5 2906.1 2983.3 3059.8 3133.4 3207.7" y="4060.6">open-source&#32;</tspan><tspan x="687.4" y="4272.2">AI that&#32;</tspan><tspan x="1199.8" y="4272.2">lets you bring your own&#32;</tspan><tspan x="2847.6" y="4272.2">policy.&#32;</tspan><tspan x="557.8" y="4482.8">Tell it&#32;</tspan><tspan x="1021.1" y="4482.8">your&#32;</tspan><tspan x="1374.4" y="4482.8">community</tspan><tspan x="2137.7" y="4482.8">'s rules&#32;</tspan><tspan x="2682.7" y="4482.8">&amp;&#32;</tspan><tspan x="2827.2" y="4482.8">values,&#32;</tspan><tspan x="730.2" y="4684">and&#32;</tspan><tspan x="1009.4" y="4684">it can assist&#32;</tspan><tspan x="1889.6" y="4684">(not replace) human&#32;</tspan><tspan x="404.3" y="4885.1">moderators in&#32;</tspan><tspan x="1417.8" y="4885.1">defending your&#32;</tspan><tspan x="2486.4" y="4885.1">community!</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="4286" y="4341.4" font-size="193.7" textLength="252" lengthAdjust="spacingAndGlyphs">Con&#32;</tspan><tspan x="4286" y="4478.7" font-size="155.8" textLength="264" lengthAdjust="spacingAndGlyphs">stitu&#32;</tspan><tspan x="4279" y="4650.3" font-size="157.9" textLength="260" lengthAdjust="spacingAndGlyphs">tion</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="128.8" fill="#000000"><text><tspan x="2915.9" y="5680.3">And&#32;</tspan><tspan x="3120.8" y="5680.3">finally,&#32;</tspan><tspan x="3485.3" y="5680.3">this&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1136.1 0)"><tspan x="3690.7" y="5680.3">book&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1136.1 0)"><tspan x="3938.7" y="5680.3">itself&#32;</tspan></text><text><tspan x="4242.8" y="5680.3">benefited&#32;</tspan><tspan x="2920.3" y="5875">from&#32;</tspan><tspan x="3187.2" y="5875">a&#32;</tspan><tspan x="3267.3" y="5876">“</tspan><tspan x="3306.9" y="5875">local&#32;</tspan><tspan x="3558.4" y="5875">spirit</tspan><tspan x="3813.7" y="5875">” Kami:&#32;</tspan><tspan x="4169.1" y="5875">not&#32;</tspan><tspan x="4360.2" y="5875">corp-slop&#32;</tspan><tspan x="2921.9" y="6070">on&#32;</tspan><tspan x="3064.6" y="6070">the&#32;</tspan><tspan x="3247.9" y="6070">cloud,&#32;</tspan><tspan x="3538.4" y="6070">but&#32;</tspan><tspan x="3724.9" y="6070">a Kami&#32;</tspan><tspan x="4059.9" y="6070">stewarding&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1214 0)"><tspan x="4585" y="6070">one&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1253 0)"><tspan x="2916.8" y="6265">specific&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1253 0)"><tspan x="3312.2" y="6265">relationship,&#32;</tspan></text><text><tspan x="3924.4" y="6265">locally run&#32;</tspan><tspan x="4450.6" y="6265">on&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1253 0)"><tspan x="4586.3" y="6265">one&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1292 0)"><tspan x="2912.8" y="6460">specific&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1292 0)"><tspan x="3312.2" y="6460">machine,&#32;</tspan></text><text><tspan x="3764.3" y="6460">jdd-kami.eth.</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1406" y="5942" font-size="154.7" textLength="310" lengthAdjust="spacingAndGlyphs">CIVIC.AI&#32;</tspan><tspan x="1406" y="5993.6" font-size="61.1" textLength="290" lengthAdjust="spacingAndGlyphs">HOW TO KEEP AI&#32;</tspan><tspan x="1471" y="6105.3" font-size="75.8" textLength="215" lengthAdjust="spacingAndGlyphs">IN THE LOOP OF&#32;</tspan><tspan x="1480" y="6158.2" font-size="85.3" textLength="242" lengthAdjust="spacingAndGlyphs">HUMAN COMMUNITY&#32;</tspan><tspan x="1452" y="6206.1" font-size="76.8" textLength="245" lengthAdjust="spacingAndGlyphs">&amp; FLOURISHING</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="2905.8" y="6896.7">This principle,&#32;</tspan><tspan x="3928" y="6896.7">along with all&#32;</tspan><tspan x="4888.3" y="6896.7">the&#32;</tspan><tspan x="2905.9" y="7107.7">other&#32;</tspan><tspan x="3322.1" y="7107.7">principles in this&#32;</tspan><tspan x="4530" y="7107.7">book,&#32;</tspan><tspan x="589.4" y="7318.2">is how we can&#32;</tspan><tspan x="1527.7" y="7318.2">build a future that&#32;</tspan><tspan x="2826.1" y="7318.2">does not&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 2195.4 0)"><tspan x="3438.2" y="7318.2">concentrate&#32;</tspan></text><text><tspan x="4348.5" y="7318.2">power</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="192.6" fill="#000000"><text><tspan x="590.3" y="7520.9">but&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 1880.2 0)"><tspan x="855.2" y="7520.9">shares&#32;</tspan></text><text><tspan x="1381.1" y="7520.9">power&#32;</tspan><tspan x="1829.4" y="7520.9">among&#32;</tspan><tspan x="2327.6" y="7520.9">people.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="3372.8" y="7520.6">Live long and prosper!</tspan></text></g></g></svg>
