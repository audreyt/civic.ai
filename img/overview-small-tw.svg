<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5742 8000" width="1280" height="1781" lang="zh-Hant-TW"><title>關懷六力概覽</title><desc>Nicky Case 手繪的關懷六力概覽：由上往下看的六罐飲料，每罐代表一力。紅罐「真的傾聽人們想說的話」：不是只聽受歡迎／有權勢的人，而是也聽見小眾與弱勢的聲音。橘罐「真的承諾人們在乎的事」：不是空泛理想、說說就算，而是具體承諾、有力量的約定。黃罐「人們檢核『過程』」：不是「相信我們就好啦（笑）」，而是可見透明與快速社群反饋。綠罐「人們檢核『結果』」：不是與我們價值無關的那些指標，而是我們設計、服務我們的指標。藍罐「儘量雙贏」：不是保證玉石俱焚，而是讓每一邊都更好的協議。紫罐「儘量在地」：不是一體適用的中央霸主，而是多元社群打造的多樣解方。下方兩個角色舉起六罐裝互相乾杯。</desc><style>text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/overview-small-tw.avif" width="5742" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="sans-serif" fill-opacity="0"><tspan x="1278" y="510.2" font-size="209.8" textLength="808" lengthAdjust="spacingAndGlyphs">真的傾聽</tspan><tspan x="1070" y="761.2" font-size="209.8" textLength="1224" lengthAdjust="spacingAndGlyphs">人們想說的話</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="856" y="2045.2" font-size="109.8" textLength="1500" lengthAdjust="spacingAndGlyphs">不是：只聽受歡迎／有權勢的人</tspan><tspan x="857" y="2176.2" font-size="109.8" textLength="1499" lengthAdjust="spacingAndGlyphs">而是：也聽見小眾與弱勢的聲音</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3705" y="529.1" font-size="210.9" textLength="808" lengthAdjust="spacingAndGlyphs">真的承諾</tspan><tspan x="3496" y="779.6" font-size="210.9" textLength="1224" lengthAdjust="spacingAndGlyphs">人們在乎的事</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3366" y="2045.1" font-size="110.9" textLength="1278" lengthAdjust="spacingAndGlyphs">不是：空泛理想，說說就算</tspan><tspan x="3362" y="2176.6" font-size="110.9" textLength="1499" lengthAdjust="spacingAndGlyphs">而是：具體承諾、有力量的約定</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1257" y="2977.1" font-size="205.4" textLength="775" lengthAdjust="spacingAndGlyphs">人們檢核「</tspan><tspan x="1354" y="3218.6" font-size="205.4" textLength="581" lengthAdjust="spacingAndGlyphs">過程」</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="855" y="4397" font-size="113" textLength="1560" lengthAdjust="spacingAndGlyphs">不是：「相信我們就好啦（笑）」</tspan><tspan x="857" y="4530.5" font-size="113" textLength="1498" lengthAdjust="spacingAndGlyphs">而是：可見透明與快速社群反饋</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3736" y="2985.1" font-size="205.4" textLength="773" lengthAdjust="spacingAndGlyphs">人們檢核「</tspan><tspan x="3832" y="3226.6" font-size="205.4" textLength="581" lengthAdjust="spacingAndGlyphs">結果」</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3283" y="4395.1" font-size="110.9" textLength="1611" lengthAdjust="spacingAndGlyphs">不是：與我們價值無關的那些指標</tspan><tspan x="3285" y="4529.1" font-size="110.9" textLength="1609" lengthAdjust="spacingAndGlyphs">而是：我們設計、服務我們的指標</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1149" y="5617.2" font-size="259.8" textLength="1005" lengthAdjust="spacingAndGlyphs">儘量雙贏</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="957" y="6875.1" font-size="110.9" textLength="958" lengthAdjust="spacingAndGlyphs">不是：保證玉石俱焚</tspan><tspan x="957" y="7007.1" font-size="110.9" textLength="1390" lengthAdjust="spacingAndGlyphs">而是：讓每一邊都更好的協議</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3599" y="5617.2" font-size="259.8" textLength="1009" lengthAdjust="spacingAndGlyphs">儘量在地</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3361" y="6875.6" font-size="110.9" textLength="1283" lengthAdjust="spacingAndGlyphs">不是：一體適用的中央霸主</tspan><tspan x="3362" y="7007.1" font-size="110.9" textLength="1498" lengthAdjust="spacingAndGlyphs">而是：多元社群打造的多樣解方</tspan></text></g></svg>
