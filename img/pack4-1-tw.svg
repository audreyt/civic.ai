<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5742 8000" width="1437" height="1999" lang="zh-Hant-TW"><title>四：回應力 — 問題</title><desc>手繪漫畫頁，標題為「RESPONSIVENESS——PROBLEM」：一隻拿著羅盤的兔子說明社會需要指標來判斷前進方向，但這些指標往往是壞掉的；成對的圖表對比上揚的「平均收入」與真實情況——上層階級的收入大幅上升、下層階級的收入卻停滯——並以一張對照表把點擊對應到標題黨、留言對應到激怒式論戰、使用者好評對應到諂媚的聊天機器人。</desc><style>text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack4-1-tw-2874w.avif" width="5742" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="sans-serif" fill-opacity="0"><tspan x="2412" y="907.4" font-size="682.6" textLength="1876" lengthAdjust="spacingAndGlyphs">回應力</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="376" y="1774.5" font-size="431.5" textLength="1108" lengthAdjust="spacingAndGlyphs">問題：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="2497" y="1932.4" font-size="194.6" textLength="2848" lengthAdjust="spacingAndGlyphs">就像航海者需要羅盤，社會也需要</tspan><tspan x="2498" y="2167.4" font-size="194.6" textLength="2788" lengthAdjust="spacingAndGlyphs">一種方法來衡量我們前進的方向。</tspan><tspan x="2495" y="2399.9" font-size="194.6" textLength="2849" lengthAdjust="spacingAndGlyphs">所以，我們使用指標！但可惜，指</tspan><tspan x="2494" y="2631.9" font-size="194.6" textLength="1259" lengthAdjust="spacingAndGlyphs">標往往會失靈。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="365" y="3520.3" font-size="170.7" textLength="1982" lengthAdjust="spacingAndGlyphs">舉例來說，決策者也許會說</tspan><tspan x="446" y="3720.3" font-size="170.7" textLength="1687" lengthAdjust="spacingAndGlyphs">「平均收入」上升了……</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="2867" y="3500.5" font-size="168.5" textLength="2084" lengthAdjust="spacingAndGlyphs">但「平均」掩蓋了一個事實：</tspan><tspan x="2867" y="3700.5" font-size="168.5" textLength="1755" lengthAdjust="spacingAndGlyphs">上層階級收入大幅上升，</tspan><tspan x="2869" y="3901" font-size="168.5" textLength="2217" lengthAdjust="spacingAndGlyphs">下層階級……卻停滯甚至下降。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="863" y="5920" font-size="250" textLength="471" lengthAdjust="spacingAndGlyphs">指標</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1898" y="5913.5" font-size="243.5" textLength="466" lengthAdjust="spacingAndGlyphs">失靈</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1061" y="6379.5" font-size="143.5" textLength="260" lengthAdjust="spacingAndGlyphs">點擊</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1883" y="6379.5" font-size="143.5" textLength="403" lengthAdjust="spacingAndGlyphs">標題黨</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1061" y="6858.5" font-size="143.5" textLength="263" lengthAdjust="spacingAndGlyphs">留言</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1848" y="6879.6" font-size="142.4" textLength="690" lengthAdjust="spacingAndGlyphs">激怒式論戰</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="879" y="7308.5" font-size="143.5" textLength="687" lengthAdjust="spacingAndGlyphs">使用者好評</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1814" y="7180.7" font-size="141.3" textLength="403" lengthAdjust="spacingAndGlyphs">諂媚的</tspan><tspan x="1814" y="7348.7" font-size="141.3" textLength="692" lengthAdjust="spacingAndGlyphs">聊天機器人</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3161" y="5784.6" font-size="160.9" textLength="2185" lengthAdjust="spacingAndGlyphs">同樣地，那些運行在現代媒體又</tspan><tspan x="3160" y="5976.6" font-size="160.9" textLength="1863" lengthAdjust="spacingAndGlyphs">因此運行現代文化與政治的</tspan><tspan x="3224" y="6168.1" font-size="160.9" textLength="2008" lengthAdjust="spacingAndGlyphs">「演算法與 AI」，所用的指標</tspan><tspan x="3147" y="6359.1" font-size="160.9" textLength="2148" lengthAdjust="spacingAndGlyphs">都有著那所謂惡名昭彰的失靈。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3136" y="6886.5" font-size="187" textLength="2177" lengthAdjust="spacingAndGlyphs">那我們該如何衡量我們所重</tspan><tspan x="3135" y="7102.5" font-size="187" textLength="1907" lengthAdjust="spacingAndGlyphs">視的——我們的「羅盤」</tspan><tspan x="3121" y="7319" font-size="187" textLength="1419" lengthAdjust="spacingAndGlyphs">——而不被誤導？</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="2652" y="7455.1" font-size="98.9" textLength="187" lengthAdjust="spacingAndGlyphs">之類</tspan></text></g></svg>
