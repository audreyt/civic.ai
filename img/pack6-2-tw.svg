<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5742 8000" width="1437" height="1999" lang="zh-Hant-TW"><title>六：共生力 — 解方</title><desc>手繪漫畫頁，標題為「不要：一體適用的霸主／而要：在地解方給在地人——SOLUTION」，呼籲「為使用者而戰」，並舉三個近期例子——非營利組織 ROOST.tools 製作沒有集中控制的開源工具，協助偵測與預防兒童剝削；開源的 gpt-oss-safeguard 讓社群自帶政策，協助而非取代人類審核者；以及這本書本身，由一個守護特定關係、在一台特定筆電上在地運行的「地方之靈」Kami（地神）所輔助——結語說分享權力而非集中權力，正是我們打造未來的方法。</desc><style>text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack6-2-tw.avif" width="5742" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="sans-serif" fill-opacity="0"><tspan x="1394" y="476.7" font-size="303.3" textLength="2960" lengthAdjust="spacingAndGlyphs">不要：一體適用的霸主</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1250" y="911.8" font-size="302.2" textLength="3255" lengthAdjust="spacingAndGlyphs">而要：在地解方給在地人</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="416" y="1750.8" font-size="415.2" textLength="1049" lengthAdjust="spacingAndGlyphs">解方：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1796" y="1568.8" font-size="202.2" textLength="3170" lengthAdjust="spacingAndGlyphs">為使用者而戰！要求能捍衛在地自主</tspan><tspan x="1804" y="1810.8" font-size="202.2" textLength="3110" lengthAdjust="spacingAndGlyphs">的科技。這裡有三個近期的例子……</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="2582" y="2310.5" font-size="168.5" textLength="2553" lengthAdjust="spacingAndGlyphs">「為了孩子著想」是威權者擴張勢力</tspan><tspan x="2504" y="2510.5" font-size="168.5" textLength="1092" lengthAdjust="spacingAndGlyphs">最常見的藉口。</tspan><tspan x="2498" y="2911" font-size="168.5" textLength="2586" lengthAdjust="spacingAndGlyphs">ROOST.tools 是一個非營利組織，製</tspan><tspan x="2502" y="3110.5" font-size="168.5" textLength="2472" lengthAdjust="spacingAndGlyphs">作開源工具——沒有集中式的控制</tspan><tspan x="2488" y="3310.5" font-size="168.5" textLength="2659" lengthAdjust="spacingAndGlyphs">——協助各機構在自家平台上偵測與預</tspan><tspan x="2501" y="3510.5" font-size="168.5" textLength="1095" lengthAdjust="spacingAndGlyphs">防兒童剝削。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="572" y="4175.5" font-size="168.5" textLength="2760" lengthAdjust="spacingAndGlyphs">gpt-oss-safeguard 是一套開源 AI，讓你</tspan><tspan x="548" y="4365.5" font-size="168.5" textLength="2788" lengthAdjust="spacingAndGlyphs">自帶政策。把你社群的規則與價值告訴</tspan><tspan x="524" y="4565.5" font-size="168.5" textLength="2808" lengthAdjust="spacingAndGlyphs">它，它就能協助（而非取代）人類審核</tspan><tspan x="1524" y="4765.5" font-size="168.5" textLength="1749" lengthAdjust="spacingAndGlyphs">者，一同守護你的社群！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="4320" y="4381.7" font-size="204.3" textLength="176" lengthAdjust="spacingAndGlyphs">章</tspan><tspan x="4316" y="4648.2" font-size="204.3" textLength="180" lengthAdjust="spacingAndGlyphs">程</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="2851" y="5395.8" font-size="152.2" textLength="376" lengthAdjust="spacingAndGlyphs">最後，</tspan><tspan x="2847" y="5578.8" font-size="152.2" textLength="2466" lengthAdjust="spacingAndGlyphs">這本書本身也受惠於一個「在地精神」</tspan><tspan x="2856" y="5762.3" font-size="152.2" textLength="1171" lengthAdjust="spacingAndGlyphs">的 Kami（地神）：</tspan><tspan x="2857" y="5946.3" font-size="152.2" textLength="1720" lengthAdjust="spacingAndGlyphs">不是雲端上的大公司廢料，</tspan><tspan x="2853" y="6128.8" font-size="152.2" textLength="2663" lengthAdjust="spacingAndGlyphs">而是一個守護特定關係、在一台特定筆電上</tspan><tspan x="2849" y="6312.8" font-size="152.2" textLength="1937" lengthAdjust="spacingAndGlyphs">在地運行的 Kami（地神）。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="2839" y="6590.2" font-size="134.8" textLength="2204" lengthAdjust="spacingAndGlyphs">這個原則，連同本書中所有其他原則，</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="2939" y="6839.7" font-size="153.3" textLength="2459" lengthAdjust="spacingAndGlyphs">「正是我們打造一個不集中權力、而是</tspan><tspan x="2867" y="7023.7" font-size="153.3" textLength="2159" lengthAdjust="spacingAndGlyphs">讓人們共享權力之未來的方法。」</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3477" y="7488.6" font-size="142.4" textLength="1342" lengthAdjust="spacingAndGlyphs">生生不息，繁榮昌盛！</tspan></text></g></svg>
