<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5742 8000" width="1437" height="1999" lang="zh-Hant-TW"><title>三：勝任力 — 問題</title><desc>手繪漫畫頁，標題為「COMPETENCE——PROBLEM」，描繪左右我們生活的演算法如何從可理解走向難以理解：先是簡單的平均評分，接著是只有工程師勉強看懂的分數與對數公式，最後是糾結的機器學習圖示，旁邊一個小角色與一個灰色框，框中寫著「要成為如此浩瀚的心智，連祂自己都再也說不出自己真正的名字」。</desc><style>text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack3-1-tw-2874w.avif" width="5742" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="sans-serif" fill-opacity="0"><tspan x="2462" y="871.2" font-size="609.8" textLength="1717" lengthAdjust="spacingAndGlyphs">勝任力</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="373" y="1779.4" font-size="407.6" textLength="1047" lengthAdjust="spacingAndGlyphs">問題：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1762" y="1496.5" font-size="193.5" textLength="3547" lengthAdjust="spacingAndGlyphs">在現代國家，網際網路就是生活發生之處：</tspan><tspan x="1762" y="1730.5" font-size="193.5" textLength="3619" lengthAdjust="spacingAndGlyphs">文化、新聞、政治、購買商品與服務、結交</tspan><tspan x="1763" y="1963" font-size="193.5" textLength="491" lengthAdjust="spacingAndGlyphs">朋友。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="555" y="2361.7" font-size="179.3" textLength="4286" lengthAdjust="spacingAndGlyphs">因此：運行網路的演算法，就是運行我們生活的演算法。</tspan><tspan x="541" y="2570.7" font-size="179.3" textLength="2364" lengthAdjust="spacingAndGlyphs">起初，這些「演算法」很簡單：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="4142" y="3028.2" font-size="134.8" textLength="1039" lengthAdjust="spacingAndGlyphs">貼文，從最新排到</tspan><tspan x="4139" y="3186.7" font-size="134.8" textLength="328" lengthAdjust="spacingAndGlyphs">最舊！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="514" y="4045.4" font-size="194.6" textLength="4325" lengthAdjust="spacingAndGlyphs">後來，為了過濾雜訊，我們的演算法變得更複雜了。</tspan><tspan x="514" y="4277.9" font-size="194.6" textLength="3701" lengthAdjust="spacingAndGlyphs">使用者看不懂，但寫程式的人懂……大致上。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1069" y="5424" font-size="100" textLength="1466" lengthAdjust="spacingAndGlyphs">* 這是 reddit 在 2008 年的演算法！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3995" y="4742.9" font-size="151.1" textLength="1139" lengthAdjust="spacingAndGlyphs">這是……淨讚數的</tspan><tspan x="3997" y="4926.4" font-size="151.1" textLength="1320" lengthAdjust="spacingAndGlyphs">對數，再依時間</tspan><tspan x="4017" y="4918.4" font-size="151.1" textLength="13" lengthAdjust="spacingAndGlyphs">折扣……我想</tspan><tspan x="3999" y="5109.9" font-size="151.1" textLength="943" lengthAdjust="spacingAndGlyphs">是吧。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="529" y="5921.6" font-size="185.9" textLength="4564" lengthAdjust="spacingAndGlyphs">但如今，在機器學習的時代——程式是長出來的，不是設</tspan><tspan x="531" y="6139.1" font-size="185.9" textLength="4319" lengthAdjust="spacingAndGlyphs">計出來的——再也沒有人理解運行我們生活的演算法。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3952" y="6613.1" font-size="142.4" textLength="1206" lengthAdjust="spacingAndGlyphs">覺悟並非自我覺察，</tspan><tspan x="4096" y="6780.1" font-size="142.4" textLength="925" lengthAdjust="spacingAndGlyphs">而是自我不察。</tspan><tspan x="3953" y="6946.6" font-size="142.4" textLength="1254" lengthAdjust="spacingAndGlyphs">要成為一個如此浩瀚</tspan><tspan x="3959" y="7112.6" font-size="142.4" textLength="1248" lengthAdjust="spacingAndGlyphs">的心智，連它自己都</tspan><tspan x="3951" y="7280.1" font-size="142.4" textLength="1256" lengthAdjust="spacingAndGlyphs">再也說不出自己真正</tspan><tspan x="4313" y="7446.6" font-size="142.4" textLength="497" lengthAdjust="spacingAndGlyphs">的名字。</tspan></text></g></svg>
