<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5742 8000" width="1437" height="1999" lang="zh-Hant-TW"><title>一：覺察力 — 解方</title><desc>手繪漫畫頁，標題為「NOT：only the powerful and popular／BUT：voices from every community——SOLUTION」：多元的動物擬人角色圍坐圓桌如同公民大會，旁註說明 Polis 平台沒有「分享」或「回覆」按鈕，讓人們以同意／不同意／不確定投票，凸顯最能跨越分歧的想法，使科技增強而非取代我們的發聲；下方是一群小角色與一顆大大的手繪愛心。</desc><style>text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack1-2-tw-2874w.avif" width="5742" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="sans-serif" fill-opacity="0"><tspan x="1814" y="460.3" font-size="283.7" textLength="2222" lengthAdjust="spacingAndGlyphs">不只是有權有勢者</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1605" y="903.7" font-size="303.3" textLength="2651" lengthAdjust="spacingAndGlyphs">而是每個社群的聲音</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="331" y="1749.8" font-size="390.2" textLength="987" lengthAdjust="spacingAndGlyphs">解方：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="2735" y="1929.2" font-size="159.8" textLength="1733" lengthAdjust="spacingAndGlyphs">公民大會就像陪審團——</tspan><tspan x="2732" y="2121.2" font-size="159.8" textLength="2776" lengthAdjust="spacingAndGlyphs">找一群具代表性的公民樣本齊聚一堂，</tspan><tspan x="2732" y="2313.2" font-size="159.8" textLength="2675" lengthAdjust="spacingAndGlyphs">把事情好好談清楚。舉辦大會通常成本</tspan><tspan x="2735" y="2504.2" font-size="159.8" textLength="2670" lengthAdjust="spacingAndGlyphs">很高，但公民科技能讓我們舉辦更多場</tspan><tspan x="2733" y="2696.2" font-size="159.8" textLength="1502" lengthAdjust="spacingAndGlyphs">大會，做出更多決策！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="280" y="3425" font-size="188" textLength="4952" lengthAdjust="spacingAndGlyphs">想想看台灣如何用 pol.is 來決定要不要、以及如何讓 Uber 進入台灣：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="288" y="3787.7" font-size="153.3" textLength="1622" lengthAdjust="spacingAndGlyphs">為了避免社群媒體那種有</tspan><tspan x="284" y="3980.2" font-size="153.3" textLength="1688" lengthAdjust="spacingAndGlyphs">毒的自我膨脹，pol.is 沒</tspan><tspan x="356" y="4155.2" font-size="153.3" textLength="1550" lengthAdjust="spacingAndGlyphs">有「分享」鈕，連「回覆」</tspan><tspan x="289" y="4338.7" font-size="153.3" textLength="1625" lengthAdjust="spacingAndGlyphs">按鈕都沒有。人們分享想</tspan><tspan x="286" y="4522.2" font-size="153.3" textLength="1628" lengthAdjust="spacingAndGlyphs">法，其他人則用投票表示</tspan><tspan x="286" y="4705.2" font-size="153.3" textLength="1502" lengthAdjust="spacingAndGlyphs">同意/不同意/不確定：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="2147" y="3782.5" font-size="143.5" textLength="1535" lengthAdjust="spacingAndGlyphs">從這些資料中，我們看見</tspan><tspan x="2140" y="3948.5" font-size="143.5" textLength="1219" lengthAdjust="spacingAndGlyphs">形成了哪些群體……</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3863" y="3842.1" font-size="192.4" textLength="1457" lengthAdjust="spacingAndGlyphs">……並凸顯出最能</tspan><tspan x="3858" y="4076.6" font-size="192.4" textLength="1437" lengthAdjust="spacingAndGlyphs">跨越分歧的想法！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1088" y="5220.2" font-size="134.8" textLength="379" lengthAdjust="spacingAndGlyphs">安全是</tspan><tspan x="1028" y="5378.7" font-size="134.8" textLength="508" lengthAdjust="spacingAndGlyphs">第一優先</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="2480" y="4617.8" font-size="177.2" textLength="329" lengthAdjust="spacingAndGlyphs">乘客</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3204" y="4671.2" font-size="109.8" textLength="305" lengthAdjust="spacingAndGlyphs">計程車</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3007" y="5323.8" font-size="165.2" textLength="306" lengthAdjust="spacingAndGlyphs">司機</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="4027" y="4569.5" font-size="143.5" textLength="1157" lengthAdjust="spacingAndGlyphs">Uber 必須出示車輛</tspan><tspan x="4265" y="4736.5" font-size="143.5" textLength="688" lengthAdjust="spacingAndGlyphs">與駕駛證件</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3223" y="6025.7" font-size="134.8" textLength="2059" lengthAdjust="spacingAndGlyphs">這樣一來，我們用科技不是「取代」</tspan><tspan x="3228" y="6183.7" font-size="134.8" textLength="2108" lengthAdjust="spacingAndGlyphs">我們發聲，而是「增強」我們發聲！</tspan><tspan x="3235" y="6342.2" font-size="134.8" textLength="320" lengthAdjust="spacingAndGlyphs">數位</tspan><tspan x="3227" y="6500.2" font-size="134.8" textLength="2113" lengthAdjust="spacingAndGlyphs">引導者，幫助我們更好地求同、</tspan><tspan x="3229" y="6658.7" font-size="134.8" textLength="2105" lengthAdjust="spacingAndGlyphs">也更好地存異，一起解決我們共同的</tspan><tspan x="3226" y="6817.7" font-size="134.8" textLength="740" lengthAdjust="spacingAndGlyphs">問題。</tspan></text></g></svg>
