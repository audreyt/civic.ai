<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 6: Symbiosis — Problem</title><desc>Hand-lettered comic page headed 'SYMBIOSIS — PROBLEM' reading 'Don't put all your society in one basket': cartoon animals are packed into a single purple basket that then breaks apart, illustrating how routing modern culture, news and politics through a handful of multinational platforms creates a single point of failure — and how, even when those platforms do not fail, a bland one-size-fits-all 'success' flattens the thick middle layer of churches, local communities and the like; a row of grey figures stands below.</desc><style>@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack6-1-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack6-1-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1247" y="770.8" font-size="760" textLength="4331" lengthAdjust="spacingAndGlyphs">SYMBIOSIS</tspan></text><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="377" y="1683.4" font-size="425.3" textLength="1329" lengthAdjust="spacingAndGlyphs">PROBLEM:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="238.5" fill="#000000"><text><tspan x="1887.4" y="1650.7">Don'</tspan><tspan x="2244.7" y="1650.7">t&#32;</tspan><tspan x="2382.5" y="1650.7">put&#32;</tspan><tspan x="2717.8" y="1650.7">all&#32;</tspan><tspan x="2994" y="1650.7">your&#32;</tspan><tspan x="3435" y="1650.7">society&#32;</tspan><tspan x="4102.5" y="1650.7">in&#32;</tspan><tspan x="4320.5" y="1650.7">one&#32;</tspan><tspan x="4676.1" y="1650.7">basket.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="192" fill="#000000"><text><tspan x="485.9" y="2182.5">Our modern&#32;</tspan><tspan x="1349.4" y="2182.5">culture&#32;</tspan><tspan x="1888" y="2182.5">&amp;&#32;</tspan><tspan x="2032.9" y="2182.5">news&#32;</tspan><tspan x="2402" y="2182.5">&amp;&#32;</tspan><tspan x="487.1" y="2393.8">politics&#32;</tspan><tspan x="1044.3" y="2393.8">all go&#32;</tspan><tspan x="1470.7" y="2393.8">through a&#32;</tspan><tspan x="2173" y="2393.8">handful&#32;</tspan><tspan x="487.9" y="2604.3">of&#32;</tspan><tspan x="676.3" y="2604.3">platforms&#32;</tspan><tspan x="1417.5" y="2604.3">run by&#32;</tspan><tspan x="1901.5" y="2604.3">a&#32;</tspan><tspan x="2019.9" y="2604.3">few&#32;</tspan><tspan x="491.3" y="2815">multinational&#32;</tspan><tspan x="1465.3" y="2815">companies.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.5" fill="#000000"><text><tspan x="3026.3" y="2182.7">But this&#32;</tspan><tspan x="3614.8" y="2182.7">creates a single point&#32;</tspan><tspan x="3025.9" y="2394.1">of failure!&#32;</tspan><tspan x="3769.3" y="2394.1">Whether by&#32;</tspan><tspan x="4587.1" y="2394.1">accident&#32;</tspan><tspan x="3025.9" y="2604.2">or deliberate&#32;</tspan><tspan x="3953.5" y="2604.2">greed, these&#32;</tspan><tspan x="3025.1" y="2815.1">platforms can&#32;</tspan><tspan x="4045.5" y="2815.1">fail&#32;</tspan><tspan x="4326.2" y="2815.1">us.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="523.4" y="5660.2">And even when&#32;</tspan><tspan x="1555.9" y="5660.2">centralised platforms&#32;</tspan><tspan x="3112.3" y="5660.2">don't fail&#32;</tspan><tspan x="3755.2" y="5660.2" fill="#ACACAC">,</tspan><tspan x="3809.9" y="5659.2">&quot;</tspan><tspan x="3867.9" y="5660.2">success&quot; is&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 1698 0)"><tspan x="4650.6" y="5660.2">still&#32;</tspan></text><text><tspan x="5008.7" y="5660.2">bad:&#32;</tspan><tspan x="672.2" y="5872">a bland,&#32;</tspan><tspan x="1238.7" y="5872">one-size-fits-all&#32;</tspan><tspan x="2454.8" y="5872">culture, with no&#32;</tspan><tspan x="3559.6" y="5871">&quot;</tspan><tspan x="3617.6" y="5872">thick middle layer</tspan><tspan x="4853.2" y="5871">&quot;&#32;</tspan><tspan x="4955.2" y="5872">of&#32;</tspan><tspan x="1623.4" y="6083.1">churches, local communities,&#32;</tspan><tspan x="3645.1" y="6083.1">and so on.</tspan></text></g></g></svg>
