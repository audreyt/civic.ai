<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 2: Responsibility — Solution</title><desc>Hand-drawn comic page headed 'NOT: vague promises, BUT: exact commitments — SOLUTION': a thoughtful cat clutching an orange heart looks up at a stacked column of questions — WHO, WHAT, WHEN, WHY, HOW — beside text proposing auditable engagement contracts that name the specific person responsible while leaving the method to them, closing with the note that a Taiwan citizens' assembly earned over 85% deliberant support for its recommendations and targeted deepfake-scam categories fell by more than 94% within a year.</desc><style>@font-face{font-family:"Patrick Hand SC";src:url(/fonts/patrick-hand-sc-comics.woff2) format("woff2");font-display:block}@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack2-2-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack2-2-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="424.1" fill="#000000"><text><tspan x="1347.2" y="503.2">not:&#32;</tspan><tspan x="2102" y="503.2">vague promises&#32;</tspan><tspan x="1017" y="850.7">but: exact commitments</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="362" y="1658.3" font-size="416.8" textLength="1377" lengthAdjust="spacingAndGlyphs">SOLUTION:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="210.4" fill="#000000"><text><tspan x="1943.9" y="1525.5">We need auditable engagement&#32;</tspan><tspan x="4297.7" y="1525.5">contracts.&#32;</tspan><tspan x="1945.4" y="1765.5">For each&#32;</tspan><tspan x="2621.3" y="1765.5">task in a project,&#32;</tspan><tspan x="3946.6" y="1765.5">we assign:</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1884" y="2588.3" font-size="471.6" textLength="1105" lengthAdjust="spacingAndGlyphs">WHO</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="3286.5" y="2265.2">WHO is&#32;</tspan><tspan x="3803.8" y="2265.2">the&#32;</tspan><tspan x="4071.2" y="2265.2">one person&#32;</tspan><tspan x="3285.5" y="2476">(or few people) responsible&#32;</tspan><tspan x="3286" y="2686.4">for this task?</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1872" y="3170.3" font-size="262.1" textLength="1096" lengthAdjust="spacingAndGlyphs">WHAT</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.5" fill="#000000"><text><tspan x="3286.4" y="3077.6">WHAT should they do?</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1872" y="3700.8" font-size="332.6" textLength="1074" lengthAdjust="spacingAndGlyphs">WHEN</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="3267.4" y="3509.1">WHEN&#32;</tspan><tspan x="3704.5" y="3509.1">should they do it?</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1871" y="4398.2" font-size="481.1" textLength="1103" lengthAdjust="spacingAndGlyphs">WHY</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="192.6" fill="#000000"><text><tspan x="3266.4" y="3930.9">WHY&#32;</tspan><tspan x="3602.7" y="3930.9">do&#32;</tspan><tspan x="3798.8" y="3930.9">it?&#32;&#32;</tspan><tspan x="4062.7" y="3930.9">Remembering&#32;</tspan><tspan x="5051" y="3930.9">the&#32;</tspan><tspan x="3398.1" y="4142.4">purpose&#32;</tspan><tspan x="3984" y="4142.4">keeps&#32;</tspan><tspan x="4416.3" y="4142.4">the&#32;</tspan><tspan x="4681.4" y="4142.4">task&#32;</tspan><tspan x="3399.3 3529.3 3606 3679.5 3766.6 3809.7 3894.8 3980.5 4049.7 4126.7 4180" y="4352.9">meaningful&#32;</tspan><tspan x="4229.3 4304.8 4390.9 4467" y="4352.9">and&#32;</tspan><tspan x="4509.3 4560.6 4636.2 4703.5 4777.7" y="4352.9">lets&#32;</tspan><tspan x="4820 4886.3 4967.2" y="4352.9">the&#32;</tspan><tspan x="3398.1" y="4562.9">person&#32;</tspan><tspan x="3909.6" y="4562.9">responsible&#32;</tspan><tspan x="4745.7" y="4562.9">decide...</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1862" y="5452.8" font-size="473.7" textLength="1135" lengthAdjust="spacingAndGlyphs">HOW</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.7" fill="#000000"><text><tspan x="3401.5" y="4957.5">HOW to do&#32;</tspan><tspan x="4141.5" y="4957.5">it&#32;</tspan><tspan x="4306.5" y="4957.5">should be&#32;</tspan><tspan x="3401.7" y="5167.2">left&#32;</tspan><tspan x="3706.9" y="5167.2">up&#32;</tspan><tspan x="3908.8" y="5167.2">to the&#32;</tspan><tspan x="4362" y="5167.2">person.&#32;</tspan><tspan x="3400.8" y="5378.1">This way,&#32;</tspan><tspan x="4058.9" y="5378.1">we&#32;</tspan><tspan x="4267.1" y="5378.1">can&#32;</tspan><tspan x="4546.4" y="5378.1">have&#32;</tspan><tspan x="3400.2" y="5591.7" fill="#020202">responsibility,&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 1397.9 0)"><tspan x="4421.8" y="5591.7" fill="#020202">without&#32;</tspan></text><text><tspan x="3399.3" y="5803.7">micromanaging.&#32;</tspan><tspan x="4548" y="5803.7">Keep&#32;</tspan><tspan x="3401.1" y="6016.1">human&#32;</tspan><tspan x="3892.7" y="6016.1">autonomy!</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="452.3" y="6397.1">Back to the&#32;</tspan><tspan x="1274.1" y="6397.1">Taiwan deepfake case: a&#32;</tspan><tspan x="2931" y="6397.1">citizens' assembly took&#32;</tspan><tspan x="451.2" y="6598.1">responsibility&#32;</tspan><tspan x="1446.8" y="6598.1">to brainstorm laws&#32;</tspan><tspan x="2790.9" y="6598.1">that 85+% of&#32;</tspan><tspan x="3733.3" y="6598.1">citizens approve of,&#32;</tspan><tspan x="457.7" y="6798.6">to balance&#32;</tspan><tspan x="1203.1" y="6798.6">avoiding scams&#32;</tspan><tspan x="2279.3" y="6798.6">with&#32;</tspan><tspan x="2599.9" y="6798.6">avoiding censorship. These laws&#32;</tspan><tspan x="4800.3" y="6798.6">put&#32;</tspan><tspan x="452" y="7000.6">fair but&#32;</tspan><tspan x="1020.3" y="7000.6">specific&#32;</tspan><tspan x="1597.9" y="7000.6">responsibilities on&#32;</tspan><tspan x="2906.7" y="7000.6">the&#32;</tspan><tspan x="3175" y="7000.6">advertisers &amp;&#32;</tspan><tspan x="4145.2" y="7000.6">platform.&#32;</tspan><tspan x="450.8" y="7201.6">The result: within&#32;</tspan><tspan x="1695.8" y="7201.6">a year, deepfake scams fell by 94%!</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="207.2" fill="#000000"><text><tspan x="958.8" y="7541.4">That</tspan><tspan x="1294.3" y="7554.4">'</tspan><tspan x="1328.3" y="7541.4">s&#32;</tspan><tspan x="1454.7" y="7541.4">how&#32;</tspan><tspan x="1767.8" y="7541.4">we&#32;</tspan><tspan x="1991.9" y="7541.4">get&#32;</tspan><tspan x="2283.5" y="7541.4">both&#32;</tspan><tspan x="2654.3" y="7541.4">responsibility&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 2262.4 0)"><tspan x="3700.2" y="7541.4">and&#32;</tspan></text><text><tspan x="4024.5" y="7541.4">autonomy!</tspan></text></g></g></svg>
