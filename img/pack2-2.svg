<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 2: Responsibility — Solution</title><desc>Hand-drawn comic page headed 'NOT: vague promises, BUT: exact commitments — SOLUTION': a thoughtful cat clutching an orange heart looks up at a stacked column of questions — WHO, WHAT, WHEN, WHY, HOW — beside text proposing auditable engagement contracts that name the specific person responsible while leaving the method to them, closing with the note that a Taiwan citizens' assembly earned over 85% deliberant support for its recommendations and targeted deepfake-scam categories fell by more than 94% within a year.</desc><style>@font-face{font-family:"Patrick Hand SC";src:url(/fonts/patrick-hand-sc-comics.woff2) format("woff2");font-display:block}@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack2-2-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack2-2-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="424.1" fill="#000000"><text><tspan x="1347.2" y="503.2">not:&#32;</tspan><tspan x="2102" y="503.2">vague promises&#32;</tspan><tspan x="1017" y="850.7">but: exact commitments</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="362" y="1658.3" font-size="416.8" textLength="1377" lengthAdjust="spacingAndGlyphs">SOLUTION:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="210.3" fill="#000000"><text><tspan x="1943.9" y="1525">We&#32;</tspan><tspan x="2206.5" y="1525">need auditable engagement&#32;</tspan><tspan x="4298" y="1525">contracts.&#32;</tspan><tspan x="1944.4" y="1765">For each task in&#32;</tspan><tspan x="3182.7" y="1765">a project, we assign:</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1884" y="2588.3" font-size="471.6" textLength="1105" lengthAdjust="spacingAndGlyphs">WHO</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="3286.5" y="2265.2">WHO is&#32;</tspan><tspan x="3803.8" y="2265.2">the&#32;</tspan><tspan x="4071.2" y="2265.2">one person&#32;</tspan><tspan x="3285.5" y="2476">(or few people) responsible&#32;</tspan><tspan x="3286" y="2686.4">for this task?</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1872" y="3170.3" font-size="262.1" textLength="1096" lengthAdjust="spacingAndGlyphs">WHAT</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.5" fill="#000000"><text><tspan x="3286.4" y="3077.6">WHAT should they do?</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1872" y="3700.8" font-size="332.6" textLength="1074" lengthAdjust="spacingAndGlyphs">WHEN</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="3267.4" y="3509.1">WHEN&#32;</tspan><tspan x="3704.5" y="3509.1">should they do it?</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1871" y="4398.2" font-size="481.1" textLength="1103" lengthAdjust="spacingAndGlyphs">WHY</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.5" fill="#000000"><text><tspan x="3267.4" y="3930.7">WHY&#32;</tspan><tspan x="3602.7" y="3930.7">do it?&#32; Remembering&#32;</tspan><tspan x="5052.2" y="3930.7">the&#32;</tspan><tspan x="3399.1" y="4141.2">purpose keeps the task&#32;</tspan><tspan x="3398.3" y="4352.2">meaningful&#32;</tspan><tspan x="4230.4" y="4352.2">and&#32;</tspan><tspan x="4509.7" y="4352.2">lets the&#32;</tspan><tspan x="3399.1" y="4562.7">person responsible&#32;</tspan><tspan x="4747.6" y="4562.7">decide...</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1862" y="5452.8" font-size="473.7" textLength="1135" lengthAdjust="spacingAndGlyphs">HOW</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.5" fill="#000000"><text><tspan x="3401.5" y="4956.4">HOW to do it&#32;</tspan><tspan x="4307.2" y="4956.4">should be&#32;</tspan><tspan x="3401.7" y="5167.2">left&#32;</tspan><tspan x="3706.4" y="5167.2">up to the person.&#32;</tspan><tspan x="3401.8" y="5378.1">This&#32;</tspan><tspan x="3731.4" y="5378.1">way, we can&#32;</tspan><tspan x="4546.6" y="5378.1">have&#32;</tspan><tspan x="3401.2" y="5591.7">responsibility,&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 1397.9 0)"><tspan x="4422.2" y="5591.7">without&#32;</tspan></text><text><tspan x="3400.3" y="5803.7">micromanaging.&#32;</tspan><tspan x="4549.2" y="5803.7">Keep&#32;</tspan><tspan x="3401.2" y="6015.6">human&#32;</tspan><tspan x="3892.9" y="6015.6">autonomy!</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="171.3" fill="#000000"><text><tspan x="451.4" y="6390.1">Back&#32;</tspan><tspan x="788.4" y="6390.1">to&#32;</tspan><tspan x="959.8" y="6390.1">the&#32;</tspan><tspan x="1204.3" y="6390.1">Taiwan&#32;</tspan><tspan x="1650.3" y="6390.1">deepfake&#32;</tspan><tspan x="2235.2" y="6390.1">case:&#32;</tspan><tspan x="2577.1" y="6390.1">a&#32;</tspan><tspan x="2684.7" y="6390.1">citizens</tspan><tspan x="3170.7" y="6390.1">'&#32;</tspan><tspan x="3236.2" y="6390.1">assembly&#32;</tspan><tspan x="3851" y="6390.1">took&#32;</tspan><tspan x="4156.6" y="6390.1">responsibility&#32;</tspan><tspan x="5046.5" y="6390.1">to&#32;</tspan><tspan x="452.1" y="6571.1">balance avoiding&#32;</tspan><tspan x="1488.5" y="6571.1">scams with avoiding&#32;</tspan><tspan x="2737.3" y="6571.1">censorship.&#32;</tspan><tspan x="3471.1" y="6571.1">After&#32;</tspan><tspan x="3850.7" y="6571.1">deliberation,&#32;</tspan><tspan x="4651.3" y="6571.1">85%&#32;</tspan><tspan x="4945.5" y="6571.1">of&#32;</tspan><tspan x="449" y="6752.1">participants&#32;</tspan><tspan x="1238.8" y="6752.1">agreed&#32;</tspan><tspan x="1695.8" y="6752.1">that&#32;</tspan><tspan x="1998.1" y="6752.1">large&#32;</tspan><tspan x="2358.7" y="6752.1">platforms&#32;</tspan><tspan x="3017" y="6752.1">should&#32;</tspan><tspan x="3449.3" y="6752.1">take&#32;</tspan><tspan x="3752.1" y="6752.1">primary&#32;</tspan><tspan x="4288.2" y="6752.1">responsibility&#32;</tspan><tspan x="450.4" y="6933.1">for&#32;</tspan><tspan x="684.3" y="6933.1">information&#32;</tspan><tspan x="1455.5" y="6933.1">integrity. The&#32;</tspan><tspan x="2344.2" y="6933.1">statute later put&#32;</tspan><tspan x="3417.6" y="6933.1">specific&#32;</tspan><tspan x="3938.7" y="6933.1">duties&#32;</tspan><tspan x="4343.9" y="6933.1">on&#32;</tspan><tspan x="446.7" y="7114">advertisers and&#32;</tspan><tspan x="1435" y="7114">platforms.&#32;</tspan><tspan x="2126" y="7114">By&#32;</tspan><tspan x="2323.7" y="7114">June&#32;</tspan><tspan x="2641.7" y="7114">2026,&#32;</tspan><tspan x="3018.1" y="7114">detected&#32;</tspan><tspan x="3576.1" y="7114">identity-impersonation&#32;</tspan><tspan x="5041" y="7114">scam&#32;</tspan><tspan x="456.7" y="7294.1">ads&#32;</tspan><tspan x="697.1" y="7294.1">were&#32;</tspan><tspan x="1019.1" y="7294.1">about&#32;</tspan><tspan x="1399.8" y="7294.1">98%&#32;</tspan><tspan x="1683.4" y="7294.1">below&#32;</tspan><tspan x="2058.5" y="7294.1">their&#32;</tspan><tspan x="2405.3" y="7294.1">2024&#32;</tspan><tspan x="2745.1" y="7294.1">weekly&#32;</tspan><tspan x="3186.3" y="7294.1">peak.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="207.2" fill="#000000"><text><tspan x="958.8" y="7541.4">That</tspan><tspan x="1294.3" y="7554.4">'</tspan><tspan x="1328.3" y="7541.4">s&#32;</tspan><tspan x="1454.7" y="7541.4">how&#32;</tspan><tspan x="1767.8" y="7541.4">we&#32;</tspan><tspan x="1991.9" y="7541.4">get&#32;</tspan><tspan x="2283.5" y="7541.4">both&#32;</tspan><tspan x="2654.3" y="7541.4">responsibility&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 2262.4 0)"><tspan x="3700.2" y="7541.4">and&#32;</tspan></text><text><tspan x="4024.5" y="7541.4">autonomy!</tspan></text></g></g></svg>
