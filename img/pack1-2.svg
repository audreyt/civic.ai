<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 1: Attentiveness — Solution</title><desc>Hand-lettered comic page headed 'NOT: only the powerful and popular, BUT: voices from every community — SOLUTION': diverse animal-headed citizens sit round a table as a citizens' assembly, with notes explaining that the Polis platform has no 'share' or 'reply' button and lets people vote Agree / Disagree / Unsure to surface the ideas that best bridge divides, so technology enhances rather than replaces our voice; a crowd of small figures and a large hand-drawn heart sit below.</desc><style>@font-face{font-family:"Patrick Hand SC";src:url(/fonts/patrick-hand-sc-comics.woff2) format("woff2");font-display:block}@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack1-2-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack1-2-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="424.3" fill="#000000"><text><tspan x="346.2" y="493.6">not: only the&#32;</tspan><tspan x="2467.3" y="493.6">powerful</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="340.9" fill="#000000"><text><tspan x="3944.7" y="492">&amp;</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="424.7" fill="#000000"><text><tspan x="4242.9" y="493.6">popular</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="418.9" fill="#000000"><text><tspan x="347.2" y="876">but:&#32;</tspan><tspan x="1076" y="876">voices from every community</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="362" y="1658.3" font-size="416.8" textLength="1373" lengthAdjust="spacingAndGlyphs">SOLUTION:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.5" fill="#000000"><text><tspan x="2746" y="1574.7">Citizens' assemblies&#32;</tspan><tspan x="4190.5" y="1574.7">are like juries —&#32;</tspan><tspan x="2747.2" y="1785.6">a&#32;</tspan><tspan x="2865.4" y="1785.6">representative&#32;</tspan><tspan x="3928.5" y="1785.6">sample of&#32;</tspan><tspan x="4649.9" y="1785.6">citizens&#32;</tspan><tspan x="2746.5" y="1995.7">get&#32;</tspan><tspan x="3016.9" y="1995.7">together,&#32;</tspan><tspan x="3699.5" y="1995.7">and talk&#32;</tspan><tspan x="4294.4" y="1995.7">things&#32;</tspan><tspan x="4772.3" y="1995.7">through.&#32;</tspan><tspan x="2746.4" y="2207.2">Assemblies are&#32;</tspan><tspan x="3828.8" y="2207.2">usually&#32;</tspan><tspan x="4356.8" y="2207.2">expensive&#32;</tspan><tspan x="5075.2" y="2207.2">to&#32;</tspan><tspan x="2746.2" y="2417.9">run&#32;</tspan><tspan x="3029.2" y="2417.9">but civic&#32;</tspan><tspan x="3647.8" y="2417.9">tech can&#32;</tspan><tspan x="4266.8" y="2417.9">let us run more&#32;</tspan><tspan x="2746.2" y="2628.1">assemblies,&#32;</tspan><tspan x="3579.8" y="2628.1">for more&#32;</tspan><tspan x="4244" y="2628.1">decisions!</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="2632" y="2992.1">Consider how Taiwan used&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 748 0)"><tspan x="4432.2" y="2992.1">pol.is&#32;</tspan></text><text><tspan x="4880.4" y="2992.1">to&#32;</tspan><tspan x="2631.2" y="3203.6">decide&#32;</tspan><tspan x="3094.7" y="3203.6">if/how to let Uber enter Taiwan:</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.5" fill="#000000"><text><tspan x="318.8" y="3721.7">To avoid the toxic&#32;</tspan><tspan x="1575.6" y="3721.7">ego of&#32;</tspan><tspan x="386.5" y="3932.7">social&#32;</tspan><tspan x="823.6" y="3932.7">media,&#32;</tspan><tspan x="1304.3" y="3932.7">pol.is has&#32;</tspan><tspan x="539.6" y="4143.5">no &quot;share&quot;&#32;</tspan><tspan x="1285.5" y="4143.5">or&#32;</tspan><tspan x="1481.4" y="4143.5">even&#32;</tspan><tspan x="405.6" y="4354.2">&quot;reply&quot;&#32;</tspan><tspan x="928.4" y="4354.2">button.&#32;</tspan><tspan x="1463.4" y="4354.2">People&#32;</tspan><tspan x="348.5" y="4564.6">share&#32;</tspan><tspan x="770.6" y="4564.6">ideas,&#32;</tspan><tspan x="1194.9" y="4564.6">others vote&#32;</tspan><tspan x="319.4" y="4775.9">Agree/Disagree/Unsure:</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="172.2" fill="#7F7F7F"><text><tspan x="1009.1" y="5216.4">safety is&#32;</tspan><tspan x="952" y="5379.3">#1 priority</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.5" fill="#000000"><text><tspan x="2169.4" y="3731.1">From&#32;</tspan><tspan x="2565.4" y="3731.1">this data,&#32;</tspan><tspan x="3244.7" y="3731.1">we see&#32;</tspan><tspan x="2255.4" y="3942.2">what&#32;</tspan><tspan x="2608.5" y="3942.2">groups form...</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="200.7" fill="#7F7F7F"><text><tspan x="2417.6" y="4631.5">Riders</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="153.3" fill="#7F7F7F"><text><tspan x="3212.8" y="4670.4">Taxis</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="201.2" fill="#7F7F7F"><text><tspan x="2919.8" y="5311.1">Drivers</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="3988.5" y="3731.2">...and&#32;</tspan><tspan x="4390.5" y="3731.2">highlight the&#32;</tspan><tspan x="3883.4" y="3942.2">ideas that&#32;</tspan><tspan x="4599.9" y="3942.2">best bridge&#32;</tspan><tspan x="4237.7" y="4152.3">the divides!</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="191.7" fill="#7F7F7F"><text><tspan x="3970.3" y="4584.4">Ubers must&#32;</tspan><tspan x="4803.2" y="4584.4">display&#32;</tspan><tspan x="4094.5" y="4756.7">car &amp; driver&#32;</tspan><tspan x="5002.2" y="4756.7">ID</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="3162.8" y="6041">This&#32;</tspan><tspan x="3492.3" y="6041">way,&#32;</tspan><tspan x="3818.6" y="6041">we use tech&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 1510.3 0)"><tspan x="4644.5" y="6041">not&#32;</tspan></text><text><tspan x="4950" y="6041">to&#32;</tspan><tspan x="3162.2" y="6253.7">replace&#32;</tspan><tspan x="3713.4" y="6253.7">our voice&#32;</tspan><tspan x="4381.8" y="6253.7">but&#32;</tspan><tspan x="4657" y="6253.7">to&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 1563.4 0)"><tspan x="4837" y="6253.7">enhance&#32;</tspan></text><text><tspan x="3160.9" y="6464.6">our&#32;</tspan><tspan x="3433.3" y="6464.6">voice! A digital&#32;</tspan><tspan x="4488.3" y="6464.6">facilitator,&#32;</tspan><tspan x="3189.7" y="6676.7">to help us agree&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 1669.2 0)"><tspan x="4331.6" y="6676.7">and&#32;</tspan></text><text><tspan x="4633.8" y="6676.7">disagree</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.7" fill="#000000"><text><tspan x="3831.3" y="6893.7">better, to&#32;</tspan><tspan x="4536.6" y="6893.7">solve our&#32;</tspan><tspan x="3832.1" y="7086.2">problems,&#32;</tspan><tspan x="4556.3" y="7086.2">together.</tspan></text></g></g></svg>
