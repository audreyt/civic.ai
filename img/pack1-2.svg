<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 1: Attentiveness — Solution</title><desc>Hand-lettered comic page headed 'NOT: only the powerful and popular, BUT: voices from every community — SOLUTION': diverse animal-headed citizens sit round a table as a citizens' assembly, with notes explaining that the Polis platform has no 'share' or 'reply' button and lets people vote Agree / Disagree / Unsure to surface the ideas that best bridge divides, so technology enhances rather than replaces our voice; a crowd of small figures and a large hand-drawn heart sit below.</desc><style>@font-face{font-family:"Patrick Hand SC";src:url(/fonts/patrick-hand-sc-comics.woff2) format("woff2");font-display:block}@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack1-2-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack1-2-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="424.3" fill="#000000"><text><tspan x="346.2" y="493.6">not: only the&#32;</tspan><tspan x="2467.3" y="493.6">powerful</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="340.9" fill="#000000"><text><tspan x="3944.7" y="492">&amp;</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="424.7" fill="#000000"><text><tspan x="4242.9" y="493.6">popular</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="418.9" fill="#000000"><text><tspan x="347.2" y="876">but:&#32;</tspan><tspan x="1076" y="876">voices from every community</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="362" y="1658.3" font-size="416.8" textLength="1373" lengthAdjust="spacingAndGlyphs">SOLUTION:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="2746" y="1574.1">Citizens' assemblies are like juries —&#32;</tspan><tspan x="2746.2" y="1785.1">a representative&#32;</tspan><tspan x="3928.4" y="1785.1">sample of citizens&#32;</tspan><tspan x="2746.5" y="1995.7">get together,&#32;</tspan><tspan x="3699.6" y="1995.7">and talk things through.&#32;</tspan><tspan x="2746.4" y="2206.7">Assemblies are usually expensive to&#32;</tspan><tspan x="2746.2" y="2417.4">run&#32;</tspan><tspan x="3028.9" y="2417.4">but&#32;</tspan><tspan x="3293.2" y="2417.4">civic tech can let&#32;</tspan><tspan x="4504.2" y="2417.4">us&#32;</tspan><tspan x="4699.5" y="2417.4">run more&#32;</tspan><tspan x="2746.2" y="2628.1">assemblies, for more decisions!</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="189.9" fill="#000000"><text><tspan x="2625.6" y="2991.8">In&#32;</tspan><tspan x="2795.7" y="2991.8">a&#32;</tspan><tspan x="2911.8" y="2991.8">related&#32;</tspan><tspan x="3444.9" y="2991.8">open&#32;</tspan><tspan x="3806.7" y="2991.8">consultation,&#32;</tspan><tspan x="4737.2" y="2991.8">Taiwan&#32;</tspan><tspan x="2632.7" y="3203.4">used&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 800.8 0)"><tspan x="2989" y="3203.4">pol.is&#32;</tspan></text><text><tspan x="3436.2" y="3203.4">to discuss&#32;</tspan><tspan x="4149.8" y="3203.4">Uber&#32;</tspan><tspan x="4525.8" y="3203.4">regulation:</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.5" fill="#000000"><text><tspan x="318.8" y="3721.7">To avoid the toxic&#32;</tspan><tspan x="1575.6" y="3721.7">ego of&#32;</tspan><tspan x="386.5" y="3932.7">social&#32;</tspan><tspan x="823.6" y="3932.7">media,&#32;</tspan><tspan x="1304.3" y="3932.7">pol.is has&#32;</tspan><tspan x="539.6" y="4143.5">no &quot;share&quot;&#32;</tspan><tspan x="1285.5" y="4143.5">or&#32;</tspan><tspan x="1481.4" y="4143.5">even&#32;</tspan><tspan x="405.6" y="4354.2">&quot;reply&quot;&#32;</tspan><tspan x="928.4" y="4354.2">button.&#32;</tspan><tspan x="1463.4" y="4354.2">People&#32;</tspan><tspan x="348.5" y="4564.6">share&#32;</tspan><tspan x="770.6" y="4564.6">ideas,&#32;</tspan><tspan x="1194.9" y="4564.6">others vote&#32;</tspan><tspan x="319.4" y="4775.9">Agree/Disagree/Unsure:</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="172.2" fill="#7F7F7F"><text><tspan x="1009.1" y="5216.4">safety is&#32;</tspan><tspan x="952" y="5379.3">#1 priority</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.5" fill="#000000"><text><tspan x="2169.4" y="3731.1">From&#32;</tspan><tspan x="2565.4" y="3731.1">this data,&#32;</tspan><tspan x="3244.7" y="3731.1">we see&#32;</tspan><tspan x="2255.4" y="3942.2">what&#32;</tspan><tspan x="2608.5" y="3942.2">groups form...</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="200.7" fill="#7F7F7F"><text><tspan x="2417.6" y="4631.5">Riders</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="153.3" fill="#7F7F7F"><text><tspan x="3212.8" y="4670.4">Taxis</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="201.2" fill="#7F7F7F"><text><tspan x="2919.8" y="5311.1">Drivers</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="3988.5" y="3731.2">...and&#32;</tspan><tspan x="4390.5" y="3731.2">highlight the&#32;</tspan><tspan x="3883.4" y="3942.2">ideas that&#32;</tspan><tspan x="4599.9" y="3942.2">best bridge&#32;</tspan><tspan x="4237.7" y="4152.3">the divides!</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="191.7" fill="#7F7F7F"><text><tspan x="3970.3" y="4584.4">Ubers must&#32;</tspan><tspan x="4803.2" y="4584.4">display&#32;</tspan><tspan x="4094.5" y="4756.7">car &amp; driver&#32;</tspan><tspan x="5002.2" y="4756.7">ID</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.2" fill="#000000"><text><tspan x="3161.8" y="6040.5">This way, we use&#32;</tspan><tspan x="4298.8" y="6040.5">tech&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 1812.2 0)"><tspan x="4642.1" y="6040.5">not&#32;</tspan></text><text><tspan x="4950.3" y="6040.5">to&#32;</tspan><tspan x="3162.2" y="6252.6">replace our voice&#32;</tspan><tspan x="4382.6" y="6252.6">but&#32;</tspan><tspan x="4657.6" y="6252.6">to&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 1875.8 0)"><tspan x="4835.4" y="6252.6">enhance&#32;</tspan></text><text><tspan x="3161.9" y="6464">our voice! A digital&#32;</tspan><tspan x="4488" y="6464">facilitator,&#32;</tspan><tspan x="3190.7" y="6676.1">to help us agree&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 2002.8 0)"><tspan x="4330.5" y="6676.1">and&#32;</tspan></text><text><tspan x="4634.4" y="6676.1">disagree</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="3832.3" y="6893.1">better,&#32;</tspan><tspan x="4350.5" y="6893.1">to solve our&#32;</tspan><tspan x="3832.2" y="7086.2">problems, together.</tspan></text></g></g></svg>
