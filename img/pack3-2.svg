<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 3: Competence — Solution</title><desc>Hand-lettered comic page headed 'NOT: just trust us lol, BUT: everyone can check the process — SOLUTION': algorithms that affect everyone should be inspectable by everyone, illustrated with Community Notes on X (formerly Birdwatch) and three animal figures checking the inputs, the free and public code (a checklist marked 'MY CODE') and the output, closing 'to trust the process, we must be able to check the process'.</desc><style>@font-face{font-family:"Patrick Hand SC";src:url(/fonts/patrick-hand-sc-comics.woff2) format("woff2");font-display:block}@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack3-2-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack3-2-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="395.2" fill="#000000"><text><tspan x="1171.2" y="496.7">not:&#32;</tspan><tspan x="1874.4" y="582.7">&quot;</tspan><tspan x="1994.2" y="496.7">just&#32;</tspan><tspan x="2708.5" y="496.7">trust us lol</tspan><tspan x="4476.1" y="582.7">&quot;&#32;</tspan><tspan x="232.2" y="843.5">but:&#32;</tspan><tspan x="918.7" y="843.5">everyone can&#32;</tspan><tspan x="2917.4" y="843.5">check the&#32;</tspan><tspan x="4402.5" y="843.5">process</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="362" y="1658.3" font-size="416.8" textLength="1377" lengthAdjust="spacingAndGlyphs">SOLUTION:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="230.2" fill="#000000"><text><tspan x="1930.8" y="1574">The&#32;</tspan><tspan x="2284.8" y="1574">algorithms&#32;</tspan><tspan x="3243.8" y="1574">that&#32;</tspan><tspan x="3640.1" y="1574">affect&#32;</tspan><tspan x="4206.7" y="1574">everyone&#32;</tspan><tspan x="1930.3" y="1827">should&#32;</tspan><tspan x="2502.5" y="1827">be&#32;</tspan><tspan x="2740" y="1827">inspectable&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 456.8 0)"><tspan x="3734.9" y="1827">by&#32;</tspan></text><text><tspan x="4009.1" y="1827">everyone!</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="619" y="2205.4">Consider Community Notes on X (formerly Birdwatch on&#32;</tspan><tspan x="4577.6" y="2205.4">Twitter).&#32;</tspan><tspan x="618.5" y="2437.1">It&#32;</tspan><tspan x="774.2" y="2437.1">works by&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 731.1 0)"><tspan x="1417.3" y="2437.1">highlighting where&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 731.1 0)"><tspan x="2729.4" y="2437.1">people&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 731.1 0)"><tspan x="3216.4" y="2437.1">who usually disagree&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 731.1 0)"><tspan x="4670" y="2437.1">agree.&#32;</tspan></text><text><tspan x="619.5" y="2659.1">So far, it's&#32;</tspan><tspan x="1384.1" y="2659.1">the&#32;</tspan><tspan x="1651.4" y="2659.1">only major&#32;</tspan><tspan x="2434.5" y="2648.1">&quot;</tspan><tspan x="2492.5" y="2659.1">fact-checking</tspan><tspan x="3451.3" y="2648.1">&quot;&#32;</tspan><tspan x="3553.2" y="2659.1">platform that has&#32;</tspan><tspan x="4823.3" y="2659.1">net-</tspan><tspan x="618.2" y="2879.1">positive ratings&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 863.7 0)"><tspan x="1737.5" y="2879.1">across&#32;</tspan></text><text><tspan x="2250.8" y="2879.1">the&#32;</tspan><tspan x="2518.1" y="2879.1">American&#32;</tspan><tspan x="3224.9" y="2879.1">political&#32;</tspan><tspan x="3829.4" y="2879.1">spectrum!</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="503.5" y="3355.1">In part,&#32;</tspan><tspan x="1056.9" y="3355.1">it's because&#32;</tspan><tspan x="503.2" y="3567">anyone can&#32;</tspan><tspan x="1308.1" y="3567">check any&#32;</tspan><tspan x="503.2" y="3778.6">part of the algorithm.&#32;</tspan><tspan x="504.3" y="3990.4">Users can see all&#32;</tspan><tspan x="1720.2" y="3990.4">inputs&#32;</tspan><tspan x="504.5" y="4202.8">(user-submitted notes)</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.6" fill="#000000"><text><tspan x="503.3" y="4725.5">Users can&#32;</tspan><tspan x="1229.3" y="4725.5">check the&#32;</tspan><tspan x="511.5" y="4938">notes are&#32;</tspan><tspan x="1203.5" y="4938">analysed&#32;</tspan><tspan x="504.4" y="5150.3">correctly&#32;</tspan><tspan x="1190" y="5150.3">(the&#32;</tspan><tspan x="1519.6" y="5150.3">code is&#32;</tspan><tspan x="505.3" y="5361.1">made&#32;</tspan><tspan x="903.7" y="5361.1">free &amp;&#32;</tspan><tspan x="1387.4" y="5361.1">public)</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="4934" y="4711.7" font-size="124.2" textLength="208" lengthAdjust="spacingAndGlyphs">MY&#32;</tspan><tspan x="4869" y="4842" font-size="113.7" textLength="311" lengthAdjust="spacingAndGlyphs">CODE:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="503.4" y="5913.5">And&#32;</tspan><tspan x="801" y="5913.5">finally,&#32;</tspan><tspan x="1338.7" y="5913.5">users&#32;</tspan><tspan x="1757.6" y="5913.5">can&#32;</tspan><tspan x="503.4" y="6124.2">check the output:&#32;</tspan><tspan x="1729.8" y="6124.2">the&#32;</tspan><tspan x="503.2" y="6336.7">highlighted notes are,&#32;</tspan><tspan x="503.4" y="6548.7">indeed,&#32;</tspan><tspan x="1016.2" y="6548.7">where&#32;</tspan><tspan x="1456.3" y="6548.7">people&#32;</tspan><tspan x="504.4" y="6760.7">who disagree&#32;</tspan><tspan x="1422.2" y="6760.7">agree.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="192.2" fill="#000000"><text><tspan x="559.9" y="7283.3">Community&#32;</tspan><tspan x="1399.4" y="7283.3">Notes&#32;</tspan><tspan x="1837.9" y="7283.3">is&#32;</tspan><tspan x="1998.1" y="7283.3">just&#32;</tspan><tspan x="2303.4" y="7283.3">one&#32;</tspan><tspan x="2587.4" y="7283.3">of&#32;</tspan><tspan x="2776" y="7283.3">many&#32;</tspan><tspan x="3192.4" y="7283.3">examples!&#32;</tspan><tspan x="3952.5" y="7283.3">The&#32;</tspan><tspan x="4242.8" y="7283.3">point&#32;</tspan><tspan x="4640.7" y="7283.3">is:&#32;</tspan><tspan x="585.7" y="7494.8">to&#32;</tspan><tspan x="772.4" y="7493.8">&quot;</tspan><tspan x="829.6" y="7494.8">trust&#32;</tspan><tspan x="1229.9" y="7494.8">the&#32;</tspan><tspan x="1495.4" y="7494.8">process</tspan><tspan x="2027.1" y="7494.8">&quot;,&#32;</tspan><tspan x="2167.3" y="7494.8">we&#32;</tspan><tspan x="2376" y="7494.8">must&#32;</tspan><tspan x="2790.8" y="7494.8">be&#32;</tspan><tspan x="2989.7" y="7494.8">able&#32;</tspan><tspan x="3314" y="7494.8">to&#32;</tspan></text><text transform="matrix(1 0 -0.35 1 2623.2 0)"><tspan x="3495.7" y="7494.8">check&#32;</tspan></text><text><tspan x="3963" y="7494.8">the&#32;</tspan><tspan x="4229.5" y="7494.8">process.</tspan></text></g></g></svg>
