<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 3: Competence — Solution</title><desc>Hand-lettered comic page headed 'NOT: just trust us lol, BUT: everyone can check the process — SOLUTION': algorithms that affect everyone should be inspectable by everyone, illustrated with Community Notes on X (formerly Birdwatch) and three animal figures checking the inputs, the free and public code (a checklist marked 'MY CODE') and the output, closing 'to trust the process, we must be able to check the process'.</desc><style>@font-face{font-family:"Patrick Hand SC";src:url(/fonts/patrick-hand-sc-comics.woff2) format("woff2");font-display:block}@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack3-2-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack3-2-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="395.2" fill="#000000"><text><tspan x="1171.2" y="496.7">not:&#32;</tspan><tspan x="1874.4" y="582.7">&quot;</tspan><tspan x="1994.2" y="496.7">just&#32;</tspan><tspan x="2708.5" y="496.7">trust us lol</tspan><tspan x="4476.1" y="582.7">&quot;&#32;</tspan><tspan x="232.2" y="843.5">but:&#32;</tspan><tspan x="918.7" y="843.5">everyone can&#32;</tspan><tspan x="2917.4" y="843.5">check the&#32;</tspan><tspan x="4402.5" y="843.5">process</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="362" y="1658.3" font-size="416.8" textLength="1377" lengthAdjust="spacingAndGlyphs">SOLUTION:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="230.1" fill="#000000"><text><tspan x="1930.8" y="1573.5">The&#32;</tspan><tspan x="2284.6" y="1573.5">algorithms&#32;</tspan><tspan x="3242.9" y="1573.5">that&#32;</tspan><tspan x="3639.9" y="1573.5">affect&#32;</tspan><tspan x="4207.2" y="1573.5">everyone&#32;</tspan><tspan x="1930.3" y="1827">should&#32;</tspan><tspan x="2503.2" y="1827">be&#32;</tspan><tspan x="2740.4" y="1827">inspectable&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 456.7 0)"><tspan x="3734.7" y="1827">by&#32;</tspan></text><text><tspan x="4009.7" y="1827">everyone!</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="180.4" fill="#000000"><text><tspan x="620.4" y="2200.2">Consider&#32;</tspan><tspan x="1239.5" y="2200.2">Community&#32;</tspan><tspan x="2029.3" y="2200.2">Notes&#32;</tspan><tspan x="2443.8" y="2200.2">on&#32;</tspan><tspan x="2636.5" y="2200.2">X&#32;</tspan><tspan x="2782.4" y="2200.2">(formerly&#32;</tspan><tspan x="3477.2" y="2200.2">Birdwatch&#32;</tspan><tspan x="4154.4" y="2200.2">on&#32;</tspan><tspan x="4353.2" y="2200.2">Twitter).&#32;</tspan><tspan x="620.3" y="2411.9">It&#32;</tspan><tspan x="776.2" y="2411.9">works&#32;</tspan><tspan x="1186.7" y="2411.9">by&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 482.4 0)"><tspan x="1372.8" y="2411.9">highlighting&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 482.4 0)"><tspan x="2198.2" y="2411.9">where&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 482.4 0)"><tspan x="2630" y="2411.9">people who&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 482.4 0)"><tspan x="3368.7" y="2411.9">usually&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 482.4 0)"><tspan x="3880.9" y="2411.9">disagree&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 482.4 0)"><tspan x="4472.7" y="2411.9">agree.&#32;</tspan></text><text><tspan x="612.3" y="2622.9">In&#32;</tspan><tspan x="771.7" y="2622.9">its&#32;</tspan><tspan x="987.1" y="2622.9">2022&#32;</tspan><tspan x="1365.7" y="2622.9">US pilot,&#32;</tspan><tspan x="1959.5" y="2622.9">selected&#32;</tspan><tspan x="2532.2" y="2622.9">notes&#32;</tspan><tspan x="2933.2" y="2622.9">were&#32;</tspan><tspan x="3272.3" y="2622.9">more&#32;</tspan><tspan x="3653.4" y="2622.9">often&#32;</tspan><tspan x="4042.7" y="2622.9">rated helpful&#32;</tspan><tspan x="625.7" y="2833.9">than&#32;</tspan><tspan x="954.3" y="2833.9">unhelpful&#32;</tspan><tspan x="1610.1" y="2833.9">by&#32;</tspan><tspan x="1803.3" y="2833.9">Democrats,&#32;</tspan><tspan x="2569.7" y="2833.9">independents,&#32;</tspan><tspan x="3496.4" y="2833.9">and&#32;</tspan><tspan x="3761.5" y="2833.9">Republicans&#32;</tspan><tspan x="4563.5" y="2833.9">alike!</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="503.5" y="3355.1">In part, it</tspan><tspan x="1165.4" y="3355.1">'s because&#32;</tspan><tspan x="503.2" y="3567">anyone can check any&#32;</tspan><tspan x="503.2" y="3778.6">part of the algorithm.&#32;</tspan><tspan x="503.3" y="3990.9">Users&#32;</tspan><tspan x="950.5" y="3990.9">can see all&#32;</tspan><tspan x="1719.8" y="3990.9">inputs&#32;</tspan><tspan x="503.5" y="4202.3">(user-submitted notes)</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="503.3" y="4725.5">Users&#32;</tspan><tspan x="950.8" y="4725.5">can&#32;</tspan><tspan x="1229.7" y="4725.5">check the&#32;</tspan><tspan x="510.6" y="4937.5">notes are analysed&#32;</tspan><tspan x="503.4" y="5149.2">correctly&#32;</tspan><tspan x="1188.4" y="5149.2">(the code is&#32;</tspan><tspan x="503.3" y="5360.5">made free &amp; public)</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="4934" y="4711.7" font-size="124.2" textLength="208" lengthAdjust="spacingAndGlyphs">MY&#32;</tspan><tspan x="4869" y="4842" font-size="113.7" textLength="311" lengthAdjust="spacingAndGlyphs">CODE:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="503.4" y="5913.5">And&#32;</tspan><tspan x="801" y="5913.5">finally,&#32;</tspan><tspan x="1338.7" y="5913.5">users&#32;</tspan><tspan x="1757.6" y="5913.5">can&#32;</tspan><tspan x="503.4" y="6124.2">check the output:&#32;</tspan><tspan x="1729.8" y="6124.2">the&#32;</tspan><tspan x="503.2" y="6336.7">highlighted notes are,&#32;</tspan><tspan x="503.4" y="6548.7">indeed,&#32;</tspan><tspan x="1016.2" y="6548.7">where&#32;</tspan><tspan x="1456.3" y="6548.7">people&#32;</tspan><tspan x="503.4" y="6760.2">who disagree&#32;</tspan><tspan x="1421.2" y="6760.2">agree.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="192.2" fill="#000000"><text><tspan x="559.9" y="7283.3">Community&#32;</tspan><tspan x="1399.4" y="7283.3">Notes&#32;</tspan><tspan x="1837.9" y="7283.3">is&#32;</tspan><tspan x="1998.1" y="7283.3">just&#32;</tspan><tspan x="2303.4" y="7283.3">one&#32;</tspan><tspan x="2587.4" y="7283.3">of&#32;</tspan><tspan x="2776" y="7283.3">many&#32;</tspan><tspan x="3192.4" y="7283.3">examples!&#32;</tspan><tspan x="3952.5" y="7283.3">The&#32;</tspan><tspan x="4242.8" y="7283.3">point&#32;</tspan><tspan x="4640.7" y="7283.3">is:&#32;</tspan><tspan x="585.7" y="7494.8">to&#32;</tspan><tspan x="772.4" y="7493.8">&quot;</tspan><tspan x="829.6" y="7494.8">trust&#32;</tspan><tspan x="1229.9" y="7494.8">the&#32;</tspan><tspan x="1495.4" y="7494.8">process</tspan><tspan x="2027.1" y="7494.8">&quot;,&#32;</tspan><tspan x="2167.3" y="7494.8">we&#32;</tspan><tspan x="2376" y="7494.8">must&#32;</tspan><tspan x="2790.8" y="7494.8">be&#32;</tspan><tspan x="2989.7" y="7494.8">able&#32;</tspan><tspan x="3314" y="7494.8">to&#32;</tspan></text><text transform="matrix(1 0 -0.35 1 2623.2 0)"><tspan x="3495.7" y="7494.8">check&#32;</tspan></text><text><tspan x="3963" y="7494.8">the&#32;</tspan><tspan x="4229.5" y="7494.8">process.</tspan></text></g></g></svg>
