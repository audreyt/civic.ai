<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 4: Responsiveness — Solution</title><desc>Hand-lettered comic page headed 'NOT: metrics that mislead us, BUT: metrics made by us, for us — SOLUTION': three steps — measure what we actually care about, measure it in multiple ways, and re-evaluate metrics often — illustrated with Weval.org, a public collection of AI-chatbot evaluations measuring values like honesty, cultural fluency, conflict resolution and mental-health best practices, with green 'BY US' and 'FOR US' arrows rising above a crowd of animal characters.</desc><style>@font-face{font-family:"Patrick Hand SC";src:url(/fonts/patrick-hand-sc-comics.woff2) format("woff2");font-display:block}@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack4-2-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack4-2-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="424.1" fill="#000000"><text><tspan x="695.2" y="474.7">not: metrics that mislead us&#32;</tspan><tspan x="497" y="841.7">but: metrics made by us, for us</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="362" y="1658.3" font-size="416.8" textLength="1377" lengthAdjust="spacingAndGlyphs">SOLUTION:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="212.9" letter-spacing="7.8" fill="#FFFFFF"><text><tspan x="307.5" y="2107.9">1.&#32;</tspan><tspan x="501.7" y="2107.9">Measure what&#32;</tspan><tspan x="1673.5" y="2107.9">we&#32;</tspan></text><text transform="matrix(1 0 -0.35 1 737.8 0)"><tspan x="1910.2" y="2107.9">actually&#32;</tspan></text><text><tspan x="498.9" y="2352.4">care about.&#32;</tspan><tspan x="307.3" y="2595.2">2. Measure&#32;</tspan><tspan x="1264" y="2595.2">it&#32;</tspan><tspan x="1458.3" y="2595.2">in&#32;</tspan></text><text transform="matrix(1 0 -0.35 1 908.3 0)"><tspan x="1647.6" y="2595.2">multiple&#32;</tspan></text><text><tspan x="2433.8" y="2595.2">ways.&#32;</tspan><tspan x="307.3" y="2838.8">3. Re-evaluate metrics&#32;</tspan><tspan x="2274.7" y="2838.8">often.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="363" y="3549.1">Consider&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 887.3 0)"><tspan x="1007.4" y="3549.1">Weval.org,&#32;</tspan></text><text><tspan x="363.2" y="3770.4">a&#32;</tspan><tspan x="481.2" y="3770.4">collection of&#32;</tspan><tspan x="363.2" y="3991.3">evaluations&#32;</tspan><tspan x="1182.3" y="3991.3">for&#32;</tspan><tspan x="363.4" y="4212.6">AI chatbots,&#32;</tspan><tspan x="363.2" y="4434.2">designed by &amp;&#32;</tspan><tspan x="1345.2" y="4434.2">for&#32;</tspan><tspan x="362.7" y="4655.2">the public!</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="363.4" y="5081.6">While&#32;</tspan><tspan x="774.8" y="5081.6">industry&#32;</tspan><tspan x="363.3" y="5311.8">mostly&#32;</tspan><tspan x="885.1" y="5311.8">tracks&#32;</tspan><tspan x="1372.2" y="5311.8">AI&#32;</tspan><tspan x="362.4" y="5541.7">capabilities,&#32;</tspan><tspan x="1224.6" y="5541.7">Weval&#32;</tspan><tspan x="363.3" y="5771.4">measures what&#32;</tspan><tspan x="363.2" y="6001.9">people value:&#32;</tspan><tspan x="363.1" y="6231.6">- honesty&#32;</tspan><tspan x="363.1" y="6461.5">- cultural&#32;</tspan><tspan x="1071.4" y="6461.5">fluency&#32;</tspan><tspan x="363.1" y="6700.8">- conflict&#32;</tspan><tspan x="1068.1" y="6700.8">resolution&#32;</tspan><tspan x="363.1" y="6930.5">- mental&#32;</tspan><tspan x="1012.2" y="6930.5">health&#32;</tspan><tspan x="495.3" y="7160.7">best&#32;</tspan><tspan x="833" y="7160.7">practices&#32;</tspan><tspan x="362.5" y="7390.9">...and so on!</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.5" fill="#000000"><text><tspan x="4522.1" y="3577.4">Each&#32;</tspan><tspan x="4879.7" y="3577.4">value is&#32;</tspan><tspan x="4148.3" y="3807">measured in many&#32;</tspan><tspan x="4100.2" y="4037">different&#32;</tspan><tspan x="4777" y="4037">ways,&#32;</tspan><tspan x="5177.3" y="4037">for&#32;</tspan><tspan x="4599.2" y="4266.4">robustness.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="4520.4" y="4765.5">And there</tspan><tspan x="5191.3" y="4764.5">'</tspan><tspan x="5222.7" y="4765.5">s a&#32;</tspan><tspan x="4228" y="4996.2">feedback loop:&#32;</tspan><tspan x="5249.8" y="4996.2">we</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="192.3" fill="#000000"><text transform="matrix(1 0 -0.3 1 1568 0)"><tspan x="4487.3 4565.9 4649.8 4732.2 4790.3 4874.3 4957.7 5027.8 5083.3" y="5226.7">evaluate&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 1568 0)"><tspan x="5166.6 5239.7 5327.5" y="5226.7">the&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 1637.4 0)"><tspan x="4495.3 4579.9 4663.8 4756.2 4814.3 4898.3 4981.6 5054.8 5104.9 5189.4 5283.3 5368.3" y="5458.1">evaluations,</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.5" fill="#000000"><text><tspan x="4273.4" y="5688.7">&amp; improve them.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="288.3" fill="#0FCE46"><text><tspan x="2332.9" y="5924.6">BY&#32;</tspan><tspan x="2332.9" y="6222">US</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="288" fill="#0FCE46"><text><tspan x="3003.6" y="5924.7">FOR&#32;</tspan><tspan x="3108.9" y="6221.9">US</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.6" fill="#000000"><text><tspan x="4177.8" y="6230.5">This&#32;</tspan><tspan x="4507.7" y="6230.5">is how we&#32;</tspan><tspan x="5167.1" y="6230.5">can&#32;</tspan><tspan x="4110.2" y="6460.7">design&#32;</tspan><tspan x="4592.9" y="6460.7">value-based&#32;</tspan><tspan x="3966.6" y="6690.6">&quot;compasses</tspan><tspan x="4760.2" y="6690.6">&quot; to guide&#32;</tspan><tspan x="4330.9" y="6920.7">our&#32;</tspan><tspan x="4601.6" y="6920.7">technology!</tspan></text></g></g></svg>
