<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 5: Solidarity — Problem</title><desc>Hand-lettered comic page headed 'SOLIDARITY — PROBLEM': when people want different things we slip into negative-sum or zero-sum thinking — two chefs both want one orange, so they could fight over it and both end up worse off (negative-sum), or split it equally, which still assumes one side's gain is the other's loss (zero-sum); a win-lose diagram sits below.</desc><style>@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack5-1-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack5-1-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1212" y="788.2" font-size="798.9" textLength="4399" lengthAdjust="spacingAndGlyphs">SOLIDARITY</tspan></text><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="377" y="1679.6" font-size="420" textLength="1329" lengthAdjust="spacingAndGlyphs">PROBLEM:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="200.6" fill="#000000"><text><tspan x="1899.2" y="1535">Whenever folks&#32;</tspan><tspan x="3052.9" y="1535">want different things,&#32;</tspan><tspan x="4681.4" y="1535">we tend&#32;</tspan><tspan x="1898.6" y="1774">towards &quot;negative-sum&quot; or &quot;zero-sum&quot; thinking.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="379.5" y="2150.7">What does that mean?&#32;</tspan><tspan x="1920.5" y="2150.7">Imagine&#32;</tspan><tspan x="379.7" y="2381.2">two chefs who both&#32;</tspan><tspan x="1707.7" y="2381.2">want an&#32;</tspan><tspan x="2272.2" y="2381.2">orange:</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="3004.8" y="2150.7">They could fight over it. And be&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 714.3 0)"><tspan x="3006.4" y="2381.2">both&#32;</tspan></text><text><tspan x="3389.5" y="2381.2">worse off:&#32;</tspan><tspan x="4124.7" y="2381.2">&quot;negative-sum&quot;.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="420.3" y="4594.2">Better&#32;</tspan><tspan x="918.1" y="4594.2">to split the&#32;</tspan><tspan x="1729.8" y="4594.2">orange equally,&#32;</tspan><tspan x="420.3" y="4815.2">but&#32;</tspan><tspan x="698.6" y="4815.2">that&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 1444.5 0)"><tspan x="1021.8" y="4815.2">still&#32;</tspan></text><text><tspan x="1385" y="4815.2">assumes&#32;</tspan><tspan x="2009.1" y="4815.2">my gain&#32;</tspan><tspan x="2596.8" y="4815.2">is&#32;</tspan><tspan x="420.6" y="5036.6">your loss. If I get more orange,&#32;</tspan><tspan x="420.6" y="5258.1">you get less,&#32;</tspan><tspan x="1326.6" y="5258.1">and vice versa.&#32;</tspan><tspan x="2379.9" y="5258.1">Gains&#32;</tspan><tspan x="420.2" y="5479.3">add to zero: &quot;zero-sum&quot;.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.6" fill="#000000"><text><tspan x="3007.3" y="4584.7">But&#32;</tspan><tspan x="3290" y="4584.7">can&#32;</tspan><tspan x="3569.1" y="4584.7">we&#32;</tspan></text><text transform="matrix(1 0 -0.35 1 1604.6 0)"><tspan x="3772.1" y="4584.7">both&#32;</tspan></text><text><tspan x="4157.7" y="4584.7">gain?&#32;</tspan><tspan x="4561.1" y="4584.7">That&#32;</tspan><tspan x="4915.3" y="4584.7">is,&#32;</tspan><tspan x="3007.6" y="4805.9">&quot;</tspan><tspan x="3064.6" y="4805.9">positive-sum&quot;</tspan><tspan x="4017.3" y="4805.9">?&#32;</tspan><tspan x="4150.8" y="4805.9">It may&#32;</tspan><tspan x="4635.3" y="4805.9">not&#32;</tspan><tspan x="4908.1" y="4805.9">always&#32;</tspan><tspan x="3007.3" y="5027.2">be&#32;</tspan><tspan x="3205.6" y="5027.2">possible,&#32;</tspan><tspan x="3843.1" y="5027.2">but&#32;</tspan><tspan x="4107.6" y="5027.2">it'd be&#32;</tspan><tspan x="4564.9" y="5027.2">a shame&#32;</tspan><tspan x="5162.9" y="5027.2">to&#32;</tspan><tspan x="3007.3" y="5248.2">miss&#32;</tspan><tspan x="3371.1" y="5248.2">the opportunity. So,&#32;</tspan><tspan x="4782.9" y="5248.2">how&#32;</tspan><tspan x="5072.3" y="5248.2">to&#32;</tspan><tspan x="3007.2" y="5469.7">aim&#32;</tspan><tspan x="3298.6" y="5469.7">for&#32;</tspan><tspan x="3569.4" y="5469.7">&quot;</tspan></text><text transform="matrix(1 0 -0.35 1 1914.4 0)"><tspan x="3609.4" y="5469.7">as&#32;</tspan></text><text transform="matrix(1 0 -0.35 1 1914.4 0)"><tspan x="3801.3" y="5469.7">win-win&#32;</tspan></text><text transform="matrix(1 0 -0.35 1 1914.4 0)"><tspan x="4358.2" y="5469.7">as possible</tspan></text><text><tspan x="5125.9" y="5469.7">&quot;&#32;</tspan><tspan x="5208" y="5469.7">?</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="143.8" fill="#000000"><text><tspan x="4203.8" y="5825">i win</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="143.5" fill="#000000"><text><tspan x="4896.4" y="6380.3">you win</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="143.6" fill="#000000"><text><tspan x="3119.4" y="6716.2">you lose</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="143.2" fill="#000000"><text><tspan x="3775.8" y="7194.8">i lose</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="152.7" fill="#6B6B6B"><text><tspan x="733.4" y="7610.2">*&#32;</tspan><tspan x="829.3" y="7610.2">This orange story grew from Follett (1925), Fisher &amp; Ury (1981), and&#32;</tspan><tspan x="4621.9" y="7610.2">Covey (1989).</tspan></text></g></g></svg>
