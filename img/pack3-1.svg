<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 3: Competence — Problem</title><desc>Hand-lettered comic page titled 'COMPETENCE — PROBLEM' tracing how the algorithms that run our lives grew from understandable to opaque: a simple average rating, then a dense fraction-and-logarithm formula only coders could follow, and finally a tangled machine-learning diagram beside a small figure and a grey box reading 'To become a mind so vast, even It can no longer speak Its own true name'.</desc><style>@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}@font-face{font-family:"Oswald";src:url(/fonts/oswald-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack3-1-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack3-1-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1163" y="764.3" font-size="716.8" textLength="4418" lengthAdjust="spacingAndGlyphs">COMPETENCE</tspan></text><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="377" y="1679.6" font-size="420" textLength="1329" lengthAdjust="spacingAndGlyphs">PROBLEM:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="1867.5" y="1487.1">In modern&#32;</tspan><tspan x="2604.4" y="1487.1">countries,&#32;</tspan><tspan x="3332.8" y="1487.1">the internet&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 446.1 0)"><tspan x="4227" y="1487.1">is&#32;</tspan></text><text><tspan x="4423.6" y="1487.1">where&#32;</tspan><tspan x="1867.3" y="1698.7">much of life&#32;</tspan><tspan x="2744.4" y="1698.7">happens:&#32;</tspan><tspan x="3387.5" y="1698.7">culture, news,&#32;</tspan><tspan x="4372.9" y="1698.7">politics,&#32;</tspan><tspan x="1866.3" y="1910.7">buying goods &amp; services, making&#32;</tspan><tspan x="4128.7" y="1910.7">friends.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.6" fill="#000000"><text><tspan x="421.8" y="2198.2">Thus:&#32;</tspan><tspan x="825" y="2198.2">the&#32;</tspan><tspan x="1090.7" y="2198.2">algorithms&#32;</tspan><tspan x="1888.7" y="2198.2">that run the&#32;</tspan><tspan x="2766.2" y="2198.2">internet&#32;</tspan><tspan x="3395.6" y="2198.2">are the&#32;</tspan><tspan x="3929.6" y="2198.2">algorithms&#32;</tspan><tspan x="4728.6" y="2198.2">that run&#32;</tspan><tspan x="422.9" y="2410.2">our&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 723.1 0)"><tspan x="691.6" y="2410.2">lives</tspan></text><text><tspan x="1012.3" y="2410.2">.&#32;&#32;</tspan><tspan x="1155.4" y="2410.2">At first,&#32;</tspan><tspan x="1765" y="2410.2">these&#32;</tspan><tspan x="2181.8" y="2409.2">&quot;</tspan><tspan x="2238.9" y="2410.2">algorithms</tspan><tspan x="2993.7" y="2410.2">&quot; were&#32;</tspan><tspan x="3454" y="2410.2">simple:</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="4117" y="2961.1" font-size="304.2" textLength="1003" lengthAdjust="spacingAndGlyphs">Posts, from&#32;</tspan><tspan x="4231" y="3167.2" font-size="281.1" textLength="909" lengthAdjust="spacingAndGlyphs">newest to&#32;</tspan><tspan x="4492" y="3298.5" font-size="211.6" textLength="602" lengthAdjust="spacingAndGlyphs">oldest!</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.5" fill="#000000"><text><tspan x="424.8" y="3999.2">Then,&#32;</tspan><tspan x="839.3" y="3999.2">to cut through noise,&#32;</tspan><tspan x="2308.7" y="3999.2">our algorithms got&#32;</tspan><tspan x="3650.7" y="3999.2">more&#32;</tspan><tspan x="4053" y="3999.2">complex.&#32;</tspan><tspan x="4713.5" y="3999.2">Users&#32;</tspan><tspan x="424.4" y="4219.6">couldn't&#32;</tspan><tspan x="1004.9" y="4219.6">understand&#32;</tspan><tspan x="1811.5" y="4219.6">them, but coders could...&#32;</tspan><tspan x="3525.6" y="4219.6">mostly.</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="4406" y="4566.1" font-size="217.9" textLength="585" lengthAdjust="spacingAndGlyphs">It’s… the&#32;</tspan><tspan x="4039" y="4811.9" font-size="282.1" textLength="1232" lengthAdjust="spacingAndGlyphs">log of net upvotes,&#32;</tspan><tspan x="4017" y="5026.5" font-size="284.2" textLength="1283" lengthAdjust="spacingAndGlyphs">discounted by time&#32;</tspan><tspan x="4316" y="5207.3" font-size="175.8" textLength="629" lengthAdjust="spacingAndGlyphs">… I think.</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="114.5" letter-spacing="4.6" fill="#666666"><text><tspan x="1102.1" y="5406.3">*&#32;</tspan><tspan x="1184.8" y="5406.3">this was&#32;</tspan><tspan x="1579.6" y="5406.3">reddit's&#32;</tspan><tspan x="1954.8" y="5406.3">algorithm&#32;</tspan><tspan x="2435.1" y="5406.3">in&#32;</tspan><tspan x="2553.5" y="5406.3">2008!</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="192.6" fill="#000000"><text><tspan x="420.2" y="5867.4">But&#32;</tspan><tspan x="703.5" y="5867.4">now,&#32;</tspan><tspan x="1038.5" y="5867.4">in&#32;</tspan><tspan x="1211" y="5867.4">the&#32;</tspan><tspan x="1477.1" y="5867.4">age&#32;</tspan><tspan x="1757.3" y="5867.4">of&#32;</tspan><tspan x="1946.4" y="5867.4">machine&#32;</tspan><tspan x="2554.6" y="5867.4">learning&#32;</tspan><tspan x="3176.5" y="5867.4">--&#32;</tspan><tspan x="3374.4" y="5867.4">where&#32;</tspan><tspan x="3812.2" y="5867.4">programs&#32;</tspan><tspan x="4528.2" y="5867.4">are&#32;</tspan></text><text transform="matrix(1 0 -0.35 1 2053.6 0)"><tspan x="4785.8" y="5867.4">grown,&#32;</tspan></text><text><tspan x="421.5" y="6088.9">not&#32;</tspan><tspan x="693.7" y="6088.9">designed&#32;</tspan><tspan x="1327.6" y="6088.9">--&#32;</tspan></text><text transform="matrix(1 0 -0.35 1 2131.1 0)"><tspan x="1497.6" y="6088.9">nobody&#32;</tspan></text><text><tspan x="2043.1" y="6088.9">understands&#32;</tspan><tspan x="2924.7" y="6088.9">the&#32;</tspan><tspan x="3189.8" y="6088.9">algorithms&#32;</tspan><tspan x="3989.7" y="6088.9">that&#32;</tspan><tspan x="4320.9" y="6088.9">run&#32;</tspan><tspan x="4601.5" y="6088.9">our&#32;</tspan><tspan x="4872.6" y="6088.9">lives.</tspan></text></g><g font-family="Oswald,'Arial Narrow','Roboto Condensed',sans-serif-condensed,sans-serif" font-size="153.9" fill="#FFFFFF"><text><tspan x="3899.3" y="6542.9">Enlightenment&#32;</tspan><tspan x="4733.6" y="6542.9">is not&#32;</tspan><tspan x="3901.2" y="6741.7">self-awareness&#32;</tspan><tspan x="4761.7" y="6741.7">but&#32;</tspan><tspan x="4979.8" y="6741.7">self-</tspan><tspan x="3900.3 3968 4035.6 4098.9 4188.4 4251.4 4301.3 4366.1 4432.6 4497.4 4555.9 4612.5 4641.4" y="6932.2">unawareness.&#32;</tspan><tspan x="4676.6 4739.5 4803.9 4840.1 4907.9 4972.7 5007.9" y="6932.2">To be a&#32;</tspan><tspan x="3900.7" y="7122.2">mind&#32;</tspan><tspan x="4210.3" y="7122.2">so vast,&#32;</tspan><tspan x="4656.9" y="7122.2">even It&#32;</tspan><tspan x="5068.2" y="7122.2">can&#32;</tspan><tspan x="3900.7" y="7312.3">no&#32;</tspan><tspan x="4067.9" y="7312.3">longer&#32;</tspan><tspan x="4451.5" y="7312.3">speak Its&#32;</tspan><tspan x="4983" y="7312.3">own&#32;</tspan><tspan x="3900.6" y="7502.9">true&#32;</tspan><tspan x="4164.1" y="7502.9">name.</tspan></text></g></g></svg>
