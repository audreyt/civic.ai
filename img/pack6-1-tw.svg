<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5742 8000" width="1437" height="1999" lang="zh-Hant-TW"><title>六：共生力 — 問題</title><desc>手繪漫畫頁，標題為「共生力——PROBLEM」，寫著「別把整個社會放進同一個籃子」：卡通動物先是全擠進一個紫色籃子，接著籃子破裂散落，說明把現代文化、新聞與政治都交給少數幾家跨國平台會造成「單點故障」——而且就算平台不出事，一體適用的「成功」也會抹平由信仰、地方社群等構成的厚實中間層；下方排著一列灰色人形。</desc><style>text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack6-1-tw-2874w.avif" width="5742" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="sans-serif" fill-opacity="0"><tspan x="2408" y="911.2" font-size="672.8" textLength="1883" lengthAdjust="spacingAndGlyphs">共生力</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="373" y="1779.4" font-size="407.6" textLength="1047" lengthAdjust="spacingAndGlyphs">問題：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1763" y="1752.3" font-size="271.7" textLength="3618" lengthAdjust="spacingAndGlyphs">別把整個社會放進同一個籃子。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="463" y="2187.8" font-size="177.2" textLength="2363" lengthAdjust="spacingAndGlyphs">我們現代的文化、新聞與政治，</tspan><tspan x="459" y="2395.8" font-size="177.2" textLength="2427" lengthAdjust="spacingAndGlyphs">全都經過少數幾家跨國公司經營</tspan><tspan x="468" y="2605.3" font-size="177.2" textLength="965" lengthAdjust="spacingAndGlyphs">的平台流淌。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3122" y="2186.1" font-size="185.9" textLength="2107" lengthAdjust="spacingAndGlyphs">但這造成了「單點故障」！</tspan><tspan x="3126" y="2402.6" font-size="185.9" textLength="2171" lengthAdjust="spacingAndGlyphs">無論是出於意外，還是蓄意</tspan><tspan x="3133" y="2620.1" font-size="185.9" textLength="2168" lengthAdjust="spacingAndGlyphs">的貪婪，這些平台都可能讓</tspan><tspan x="3128" y="2835.6" font-size="185.9" textLength="832" lengthAdjust="spacingAndGlyphs">我們失望。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="476" y="5663" font-size="188" textLength="4121" lengthAdjust="spacingAndGlyphs">而就算這些中心化平台不出事，「成功」仍然糟糕：</tspan><tspan x="475" y="5880" font-size="188" textLength="4917" lengthAdjust="spacingAndGlyphs">一種平淡、一體適用的文化，欠缺由信仰、地方社群等構成的「</tspan><tspan x="560" y="6097" font-size="188" textLength="1298" lengthAdjust="spacingAndGlyphs">厚實中間層」。</tspan></text></g></svg>
