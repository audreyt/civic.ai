<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 1: Attentiveness — Problem</title><desc>Hand-lettered comic page headed 'ATTENTIVENESS — PROBLEM': a calm rabbit ticks a multiple-choice ballot reading 'bad guy / worse guy / no chance of winning' beside a red, chaotic screaming match of monstrous figures, illustrating that citizens get only an occasional vote or an online shouting match; three small icons below stand for finding facts and values where we agree, being constructive where we disagree, and finding truly new solutions.</desc><style>@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack1-1-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack1-1-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1165" y="727" font-size="741.1" textLength="4429" lengthAdjust="spacingAndGlyphs">ATTENTIVENESS</tspan></text><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="377" y="1680.4" font-size="421.1" textLength="1329" lengthAdjust="spacingAndGlyphs">PROBLEM:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="210.3" fill="#000000"><text><tspan x="1821.7" y="1539.1">Government needs to listen&#32;</tspan><tspan x="3955.9" y="1539.1">to the needs of the&#32;</tspan><tspan x="1821.4" y="1779">governed. But right&#32;</tspan><tspan x="3344.1" y="1779">now, the two most common&#32;</tspan><tspan x="1821" y="2009">ways citizens&#32;</tspan><tspan x="2864.5" y="2009">engage with politics&#32;</tspan><tspan x="4406" y="2009">are...</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="590.4" y="2455.2">A&#32;</tspan><tspan x="726.8" y="2455.2">single multiple-choice&#32;</tspan><tspan x="551.3" y="2666.1">question every few years,</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="2510" y="2715.6" font-size="374.7" textLength="413" lengthAdjust="spacingAndGlyphs">and/or</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="3081.4" y="2388.1">A free-for-all screaming match&#32;</tspan><tspan x="3167.9" y="2598.6">on news &amp; social&#32;</tspan><tspan x="4326.5" y="2598.6">media, where&#32;</tspan><tspan x="3330.7" y="2809.6">the most outrageous&#32;</tspan><tspan x="4789.4" y="2809.6">win.</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1484" y="3341.8" font-size="205.3" textLength="1023" lengthAdjust="spacingAndGlyphs">I VOTE FOR:&#32;</tspan><tspan x="1498" y="3708.7" font-size="283.2" textLength="883" lengthAdjust="spacingAndGlyphs">bad guy&#32;</tspan><tspan x="1504" y="4028.5" font-size="188.4" textLength="905" lengthAdjust="spacingAndGlyphs">worse guy&#32;</tspan><tspan x="1502" y="4315" font-size="245.3" textLength="913" lengthAdjust="spacingAndGlyphs">no chance&#32;</tspan><tspan x="1736" y="4451.2" font-size="194.7" textLength="693" lengthAdjust="spacingAndGlyphs">of winning</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="484.8" y="5274.1">Talking face&#32;</tspan><tspan x="1381.9" y="5274.1">to&#32;</tspan><tspan x="1570.8" y="5274.1">face with neighbours is still great, but you're&#32;</tspan><tspan x="4695.3" y="5274.1">limited to&#32;</tspan><tspan x="414.7" y="5512.6">&quot;</tspan><tspan x="473.7" y="5512.6">just</tspan><tspan x="733.6" y="5512.6">&quot;&#32;</tspan><tspan x="836.5" y="5512.6">your local bubble,&#32;</tspan><tspan x="2082.2" y="5512.6">not all&#32;</tspan><tspan x="2575.3" y="5512.6">citizens. So,&#32;</tspan><tspan x="3450.5" y="5512.6">can we&#32;</tspan><tspan x="3939.8" y="5512.6">design a&#32;</tspan><tspan x="4540.5" y="5512.6">process&#32;</tspan><tspan x="5115.7" y="5512.6">that&#32;</tspan><tspan x="1790.5" y="5753.1">scales to&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 1438.3 0)"><tspan x="2450.8" y="5753.1">all&#32;</tspan></text><text><tspan x="2703.5" y="5753.1">citizens,&#32;</tspan><tspan x="3328.9" y="5753.1">that also...</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="629.5" y="7312.7">Highlights facts &amp;&#32;</tspan><tspan x="478.4" y="7524.2">values where&#32;</tspan><tspan x="1391.1" y="7524.2">we&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 2257.2 0)"><tspan x="1597.9" y="7524.2">agree,</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="2163.8" y="7312.3">Lets us be constructive&#32;</tspan><tspan x="2325.4" y="7524.1">where we&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 2257.2 0)"><tspan x="2972" y="7524.1">disagree,</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="3942.4" y="7312.7">And helps us invent&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 1881.1 0)"><tspan x="4135.6" y="7524.6">new&#32;</tspan></text><text><tspan x="4457.9" y="7524.6">solutions?</tspan></text></g></g></svg>
