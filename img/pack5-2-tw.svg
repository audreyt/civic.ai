<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5742 8000" width="1437" height="1999" lang="zh-Hant-TW"><title>五：團結力 — 解方</title><desc>手繪漫畫頁，標題為「NOT：相互保證毀滅／BUT：盡可能雙贏——SOLUTION」：在每個「什麼」背後追問更深的「為什麼」，再打造一個同時滿足雙方的新「什麼」——兩位廚師發現一人要果皮做利口酒、一人要果肉榨汁，於是雙方百分之百滿足、毫無浪費；臺灣也曾用 pol.is 平台把分歧的辯論化為雙贏——包括迎進科學家與藝術家的就業金卡——示範更好的討論如何幫助大家共贏。</desc><style>text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack5-2-tw-2874w.avif" width="5742" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="sans-serif" fill-opacity="0"><tspan x="1758" y="461.1" font-size="285.9" textLength="2236" lengthAdjust="spacingAndGlyphs">不要相互保證毀滅</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1820" y="902.2" font-size="309.8" textLength="2115" lengthAdjust="spacingAndGlyphs">而要盡可能雙贏</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="333" y="1750.8" font-size="415.2" textLength="1049" lengthAdjust="spacingAndGlyphs">解方：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1931" y="1545" font-size="188" textLength="3031" lengthAdjust="spacingAndGlyphs">退一步想。在你想要「做什麼」背後，</tspan><tspan x="1943" y="1762" font-size="188" textLength="2492" lengthAdjust="spacingAndGlyphs">問問自己：你「為何」想要它？</tspan><tspan x="1933" y="1979" font-size="188" textLength="3090" lengthAdjust="spacingAndGlyphs">接著：你能不能創造一個同時滿足</tspan><tspan x="2021" y="2195" font-size="188" textLength="2414" lengthAdjust="spacingAndGlyphs">雙方「為何」的、新的「做什麼」？</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="403" y="2454.2" font-size="109.8" textLength="2219" lengthAdjust="spacingAndGlyphs">舉例來說，也許我們的兩位主廚會對彼此說……</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="2819" y="2463.5" font-size="118.5" textLength="2673" lengthAdjust="spacingAndGlyphs">…而他們發現，雙方都能100% 滿足需求，毫無浪費！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="426" y="4599.8" font-size="152.2" textLength="2228" lengthAdjust="spacingAndGlyphs">沒錯，這例子有點刻意，但雙贏在</tspan><tspan x="425" y="4782.8" font-size="152.2" textLength="2231" lengthAdjust="spacingAndGlyphs">現實生活中其實常常找得到！幾年</tspan><tspan x="428" y="4965.8" font-size="152.2" textLength="2229" lengthAdjust="spacingAndGlyphs">前，台灣曾為了是否更改時區而激</tspan><tspan x="427" y="5149.8" font-size="152.2" textLength="524" lengthAdjust="spacingAndGlyphs">烈辯論：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="560" y="5926.9" font-size="151.1" textLength="874" lengthAdjust="spacingAndGlyphs">更改：讓台灣</tspan><tspan x="560" y="6110.4" font-size="151.1" textLength="727" lengthAdjust="spacingAndGlyphs">更具獨特性</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1953" y="5927.4" font-size="151.1" textLength="728" lengthAdjust="spacingAndGlyphs">維持：因為</tspan><tspan x="1954" y="6110.9" font-size="151.1" textLength="724" lengthAdjust="spacingAndGlyphs">更改時區的</tspan><tspan x="1951" y="6292.9" font-size="151.1" textLength="582" lengthAdjust="spacingAndGlyphs">經濟成本</tspan><tspan x="1954" y="6477.4" font-size="151.1" textLength="274" lengthAdjust="spacingAndGlyphs">太高</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="2965" y="4609.7" font-size="154.3" textLength="2328" lengthAdjust="spacingAndGlyphs">但在 pol.is 與參與官的協助下，大</tspan><tspan x="2962" y="4784.7" font-size="154.3" textLength="2382" lengthAdjust="spacingAndGlyphs">家找到了能同時滿足雙方「為何」的新</tspan><tspan x="3035" y="4968.7" font-size="154.3" textLength="2308" lengthAdjust="spacingAndGlyphs">「做什麼」：就業金卡，把科學家與</tspan><tspan x="2969" y="5151.7" font-size="154.3" textLength="1128" lengthAdjust="spacingAndGlyphs">藝術家帶進台灣。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3158" y="5924.9" font-size="176.1" textLength="656" lengthAdjust="spacingAndGlyphs">同時兼顧</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3230" y="6224.2" font-size="172.8" textLength="495" lengthAdjust="spacingAndGlyphs">獨特性</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3401" y="6522.3" font-size="171.7" textLength="152" lengthAdjust="spacingAndGlyphs">與</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3188" y="6824" font-size="175" textLength="584" lengthAdjust="spacingAndGlyphs">經濟 ???</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1207" y="7604.8" font-size="177.2" textLength="3410" lengthAdjust="spacingAndGlyphs">更好的討論，就是這樣幫助我們達成雙贏的！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="4457" y="6029.8" font-size="152.2" textLength="377" lengthAdjust="spacingAndGlyphs">歡迎，</tspan><tspan x="4384" y="6213.8" font-size="152.2" textLength="520" lengthAdjust="spacingAndGlyphs">創作者！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1084" y="2918.5" font-size="118.5" textLength="762" lengthAdjust="spacingAndGlyphs">我需要做橙酒。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1352" y="3398.6" font-size="117.4" textLength="565" lengthAdjust="spacingAndGlyphs">噢！我需要</tspan><tspan x="1416" y="3540.1" font-size="117.4" textLength="407" lengthAdjust="spacingAndGlyphs">柳橙汁。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3623" y="2901.4" font-size="126.1" textLength="591" lengthAdjust="spacingAndGlyphs">果皮與皮屑</tspan><tspan x="3686" y="3051.9" font-size="126.1" textLength="476" lengthAdjust="spacingAndGlyphs">做利口酒</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="4251" y="3205.9" font-size="126.1" textLength="222" lengthAdjust="spacingAndGlyphs">果肉</tspan><tspan x="4253" y="3356.4" font-size="126.1" textLength="225" lengthAdjust="spacingAndGlyphs">榨汁</tspan></text></g></svg>
