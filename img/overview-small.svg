<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1280" height="1781" lang="en-GB"><title>The 6-Pack of Care: overview</title><desc>Hand-drawn overview by Nicky Case: six coloured cans seen from above, one per pack. Red, 'Actually listen to people': not only the popular/powerful, but small underdogs too. Orange, 'Actually keep promises': not vague ideals, soon abandoned, but specific commitments, with teeth. Yellow, 'We check the process': not 'just trust us lol', but transparency and fast community feedback. Green, 'We check the results': not metrics that don't measure what we value, but metrics designed by and for us. Blue, 'As win-win as possible': not mutually assured destruction, but deals where all sides are better off. Purple, 'As local as possible': not a one-size-fits-all Overlord, but a variety of solutions by and for a variety of folks. Below, two characters toast with a six-pack of cans.</desc><style>@font-face{font-family:"Anton";src:url(/fonts/anton-comics.woff2) format("woff2");font-display:block}@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/overview-small-wordless-2560w.avif" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><g font-family="Anton,Impact,'Arial Narrow Bold',sans-serif-condensed,sans-serif" font-size="200" letter-spacing="4.6" fill="#000000"><text><tspan x="1290.1" y="502.4">ACTUALLY&#32;</tspan><tspan x="991.4" y="728.4">LISTEN&#32;</tspan><tspan x="1545.6" y="728.4">TO&#32;</tspan><tspan x="1779.7" y="728.4">PEOPLE</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="153.4" fill="#000000"><text><tspan x="773" y="2046.7">not:&#32;</tspan><tspan x="1026.8" y="2046.7">only&#32;</tspan><tspan x="1297.9" y="2046.7">the popular/powerful&#32;</tspan><tspan x="944.9" y="2227.5">but:&#32;</tspan><tspan x="1192" y="2227.5">small underdogs&#32;</tspan><tspan x="2126.1" y="2227.5">too</tspan></text></g><g font-family="Anton,Impact,'Arial Narrow Bold',sans-serif-condensed,sans-serif" font-size="200" letter-spacing="4.6" fill="#000000"><text><tspan x="3749.1" y="520.4">ACTUALLY&#32;</tspan><tspan x="3523.4" y="746.4">KEEP&#32;</tspan><tspan x="3941.8" y="746.4">PROMISES</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="153.3" fill="#000000"><text><tspan x="3189" y="1956.5">not: vague ideals, soon abandoned&#32;</tspan><tspan x="3351.9" y="2137">but:&#32;</tspan><tspan x="3598.8" y="2137">specific commitments,&#32;</tspan><tspan x="3831.3" y="2317.9">with&#32;</tspan><tspan x="4087.9" y="2317.9">teeth</tspan></text></g><g font-family="Anton,Impact,'Arial Narrow Bold',sans-serif-condensed,sans-serif" font-size="198.9" letter-spacing="4.5" fill="#000000"><text><tspan x="1264.4" y="2961.4">WE CHECK&#32;</tspan><tspan x="1147.1" y="3187.4">THE&#32;</tspan><tspan x="1470.3" y="3187.4">PROCESS</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="153.2" fill="#000000"><text><tspan x="1019" y="4373.7">not:&#32;</tspan><tspan x="1272.5" y="4373.7">&quot;just trust&#32;</tspan><tspan x="1882.1" y="4373.7">us lol&quot;&#32;</tspan><tspan x="937.9" y="4554.4">but:&#32;</tspan><tspan x="1184.8" y="4554.4">transparency&#32;</tspan><tspan x="1958.1" y="4554.4">&amp; fast&#32;</tspan><tspan x="1055.3" y="4735.3">community feedback</tspan></text></g><g font-family="Anton,Impact,'Arial Narrow Bold',sans-serif-condensed,sans-serif" font-size="200" letter-spacing="4.5" fill="#000000"><text><tspan x="3740.4" y="2970.4">WE&#32;</tspan><tspan x="4022.6" y="2970.4">CHECK&#32;</tspan><tspan x="3641" y="3196.4">THE&#32;</tspan><tspan x="3964.3" y="3196.4">RESULTS</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="153.4" fill="#000000"><text><tspan x="3230" y="4337">not:&#32;</tspan><tspan x="3483.8" y="4337">metrics&#32;</tspan><tspan x="3948.3" y="4337">that&#32;</tspan><tspan x="4212.7" y="4337">don't measure&#32;</tspan><tspan x="3736.3" y="4509">what we value&#32;</tspan><tspan x="3428.9" y="4680.5">but: metrics&#32;</tspan><tspan x="4140.5" y="4680.5">designed by&#32;</tspan><tspan x="3881.1" y="4852.4">&amp; for us</tspan></text></g><g font-family="Anton,Impact,'Arial Narrow Bold',sans-serif-condensed,sans-serif" font-size="198.9" letter-spacing="4.5" fill="#000000"><text><tspan x="1212.1" y="5441.4">AS WIN-WIN&#32;</tspan><tspan x="1185.1" y="5667.4">AS&#32;</tspan><tspan x="1432.4" y="5667.4">POSSIBLE</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="153.3" fill="#000000"><text><tspan x="708" y="6878.7">not: mutually&#32;</tspan><tspan x="1482.9" y="6878.7">assured destruction&#32;</tspan><tspan x="952.9" y="7059.5">but:&#32;</tspan><tspan x="1199.9" y="7059.5">deals where all&#32;</tspan><tspan x="2043.3" y="7059.5">sides&#32;</tspan><tspan x="1251.2" y="7240.5">are&#32;</tspan><tspan x="1465.5" y="7240.5">better off</tspan></text></g><g font-family="Anton,Impact,'Arial Narrow Bold',sans-serif-condensed,sans-serif" font-size="198.9" letter-spacing="4.5" fill="#000000"><text><tspan x="3763.1" y="5441.4">AS&#32;</tspan><tspan x="4010.3" y="5441.4">LOCAL&#32;</tspan><tspan x="3636.1" y="5667.4">AS POSSIBLE</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="153.3" fill="#000000"><text><tspan x="3200" y="6842.5">not:&#32;</tspan><tspan x="3453.7" y="6842.5">a one-size-fits-all Overlord</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="153.3" fill="#000000"><text><tspan x="3398.9" y="7005.3">but: a variety&#32;</tspan><tspan x="4169.8" y="7005.3">of solutions&#32;</tspan><tspan x="3615.9" y="7168.3">by &amp; for a variety&#32;</tspan><tspan x="3887.1" y="7330.9">of folks</tspan></text></g></g></svg>
