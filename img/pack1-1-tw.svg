<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5742 8000" width="1437" height="1999" lang="zh-Hant-TW"><title>一：覺察力 — 問題</title><desc>手繪漫畫頁，標題為「ATTENTIVENESS——PROBLEM」：一隻平靜的兔子勾選寫著「bad guy／worse guy／no chance of winning」的選票，旁邊是一片紅色混亂、怪物般人物的叫罵戰場，說明公民只能偶爾投票或在網路上互罵；下方三個小圖示分別代表凸顯彼此認同的事實與價值、在分歧處保持建設性，以及找出真正全新的解方。</desc><style>text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack1-1-tw-2874w.avif" width="5742" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="sans-serif" fill-opacity="0"><tspan x="2420" y="853.8" font-size="652.2" textLength="1812" lengthAdjust="spacingAndGlyphs">覺察力</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="375" y="1784.7" font-size="416.3" textLength="1068" lengthAdjust="spacingAndGlyphs">問題：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1837" y="1569.7" font-size="203.3" textLength="3107" lengthAdjust="spacingAndGlyphs">政府需要聽取人民的需求。但目前，</tspan><tspan x="1842" y="1810.7" font-size="203.3" textLength="3318" lengthAdjust="spacingAndGlyphs">公民參與政治最常見的兩種方式是……</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="644" y="2500.5" font-size="193.5" textLength="1317" lengthAdjust="spacingAndGlyphs">每隔幾年投一次</tspan><tspan x="641" y="2734.5" font-size="193.5" textLength="677" lengthAdjust="spacingAndGlyphs">單選題，</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1458" y="3396.4" font-size="219.6" textLength="970" lengthAdjust="spacingAndGlyphs">我投票給：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1451" y="3777" font-size="150" textLength="468" lengthAdjust="spacingAndGlyphs">○ 壞人</tspan><tspan x="1451" y="3960" font-size="150" textLength="768" lengthAdjust="spacingAndGlyphs">○ 更壞的人</tspan><tspan x="1451" y="4144" font-size="150" textLength="1068" lengthAdjust="spacingAndGlyphs">○ 毫無勝算的人</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="2662" y="2527.7" font-size="103.3" textLength="99" lengthAdjust="spacingAndGlyphs">且</tspan><tspan x="2697" y="2674.7" font-size="103.3" textLength="33" lengthAdjust="spacingAndGlyphs">/</tspan><tspan x="2665" y="2811.2" font-size="103.3" textLength="95" lengthAdjust="spacingAndGlyphs">或</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3053" y="2434.2" font-size="184.8" textLength="1626" lengthAdjust="spacingAndGlyphs">在新聞和社群媒體上</tspan><tspan x="3055" y="2651.2" font-size="184.8" textLength="2110" lengthAdjust="spacingAndGlyphs">無所不用其極的叫罵混戰，</tspan><tspan x="3051" y="2867.7" font-size="184.8" textLength="1388" lengthAdjust="spacingAndGlyphs">誰最聳動誰就贏。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="540" y="5337.1" font-size="160.9" textLength="4415" lengthAdjust="spacingAndGlyphs">與鄰居面對面交流固然很好，但你只能觸及「自己」位列的在地</tspan><tspan x="554" y="5529.1" font-size="160.9" textLength="4078" lengthAdjust="spacingAndGlyphs">同溫層，而非所有公民。那麼，我們可否設計一個能擴展到</tspan><tspan x="542" y="5720.6" font-size="160.9" textLength="2311" lengthAdjust="spacingAndGlyphs">所有公民的流程，而且還可以……</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="458" y="7359.8" font-size="177.2" textLength="1537" lengthAdjust="spacingAndGlyphs">凸顯我們意見一致的</tspan><tspan x="449" y="7567.8" font-size="177.2" textLength="966" lengthAdjust="spacingAndGlyphs">事實與價值，</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="2239" y="7331.5" font-size="168.5" textLength="1645" lengthAdjust="spacingAndGlyphs">讓我們在意見分歧之處</tspan><tspan x="2239" y="7531.5" font-size="168.5" textLength="920" lengthAdjust="spacingAndGlyphs">保持建設性，</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="4141" y="7318.5" font-size="168.5" textLength="803" lengthAdjust="spacingAndGlyphs">並幫助我們</tspan><tspan x="4140" y="7518.5" font-size="168.5" textLength="1276" lengthAdjust="spacingAndGlyphs">創造出新的解方？</tspan></text></g></svg>
