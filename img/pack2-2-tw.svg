<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5742 8000" width="1437" height="1999" lang="zh-Hant-TW"><title>二：負責力 — 解方</title><desc>手繪漫畫頁，標題為「NOT：vague promises／BUT：exact commitments——SOLUTION」：一隻若有所思、抱著橘色愛心的貓抬頭望向一疊大字問題——WHO、WHAT、WHEN、WHY、HOW——旁邊文字提出可稽核的「參與契約」，指定具體負責的人、但把做法交由其自行決定，結尾說明臺灣公民大會的建議獲得逾 85% 與會公民支持，一年內目標類別的深偽詐騙下降超過 94%。</desc><style>text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack2-2-tw-2874w.avif" width="5742" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="sans-serif" fill-opacity="0"><tspan x="1954" y="560.6" font-size="267.4" textLength="1833" lengthAdjust="spacingAndGlyphs">不要模糊的承諾</tspan><tspan x="1959" y="877.6" font-size="267.4" textLength="1828" lengthAdjust="spacingAndGlyphs">而要明確的承諾</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="333" y="1750.8" font-size="415.2" textLength="1049" lengthAdjust="spacingAndGlyphs">解方：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1906" y="1573.3" font-size="196.7" textLength="3230" lengthAdjust="spacingAndGlyphs">我們需要可稽核的「參與契約」。針對</tspan><tspan x="1904" y="1805.8" font-size="196.7" textLength="2778" lengthAdjust="spacingAndGlyphs">專案中的每項任務，我們都指派：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1812" y="2836.5" font-size="337" textLength="547" lengthAdjust="spacingAndGlyphs">誰</tspan><tspan x="1812" y="3235.5" font-size="337" textLength="1201" lengthAdjust="spacingAndGlyphs">做什麼</tspan><tspan x="1812" y="3635" font-size="337" textLength="878" lengthAdjust="spacingAndGlyphs">何時</tspan><tspan x="1812" y="4035" font-size="337" textLength="881" lengthAdjust="spacingAndGlyphs">為何</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="2055" y="5531" font-size="400" textLength="750" lengthAdjust="spacingAndGlyphs">如何</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3416" y="2487.9" font-size="151.1" textLength="470" lengthAdjust="spacingAndGlyphs">「誰」?</tspan><tspan x="3570" y="2679.9" font-size="151.1" textLength="1172" lengthAdjust="spacingAndGlyphs">是負責這項任務的</tspan><tspan x="3571" y="2863.9" font-size="151.1" textLength="1541" lengthAdjust="spacingAndGlyphs">那個人（或少數幾人）?</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3339" y="3210.3" font-size="170.7" textLength="1384" lengthAdjust="spacingAndGlyphs">他們該「做什麼」?</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3345" y="3567.3" font-size="170.7" textLength="1427" lengthAdjust="spacingAndGlyphs">他們該「何時」做 ?</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3451" y="3932.3" font-size="152.2" textLength="1013" lengthAdjust="spacingAndGlyphs">「為何」要做 ?</tspan><tspan x="3586" y="4138.8" font-size="152.2" textLength="1777" lengthAdjust="spacingAndGlyphs">記住目的，能讓任務保有意&#32;&#32;</tspan><tspan x="3568" y="4323.8" font-size="152.2" textLength="1775" lengthAdjust="spacingAndGlyphs">義，也讓負責的人能自行決&#32;</tspan><tspan x="3566" y="4505.3" font-size="152.2" textLength="387" lengthAdjust="spacingAndGlyphs">定……</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3391" y="5086.9" font-size="151.1" textLength="1013" lengthAdjust="spacingAndGlyphs">「如何」去做 ?</tspan><tspan x="3544" y="5277.9" font-size="151.1" textLength="1582" lengthAdjust="spacingAndGlyphs">應該交給負責的人決定。</tspan><tspan x="3540" y="5460.9" font-size="151.1" textLength="1332" lengthAdjust="spacingAndGlyphs">這樣一來，我們既能</tspan><tspan x="3547" y="5644.9" font-size="151.1" textLength="1777" lengthAdjust="spacingAndGlyphs">落實責任，又不必事事微觀&#32;</tspan><tspan x="3541" y="5827.9" font-size="151.1" textLength="1274" lengthAdjust="spacingAndGlyphs">理。保留人的自主！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="563" y="6541.8" font-size="152.2" textLength="4314" lengthAdjust="spacingAndGlyphs">回到台灣的深偽案例：一場公民大會承擔起責任，集思廣益制定出&#32;</tspan><tspan x="550" y="6724.8" font-size="152.2" textLength="4444" lengthAdjust="spacingAndGlyphs">85% 以上公民都認同的法律，在避免詐騙與避免審查之間取得平衡。</tspan><tspan x="551" y="6907.8" font-size="152.2" textLength="4430" lengthAdjust="spacingAndGlyphs">這些法律對廣告商與平臺課以公平卻明確的責任。結果：一年之內，</tspan><tspan x="554" y="7091.3" font-size="152.2" textLength="1579" lengthAdjust="spacingAndGlyphs">深偽詐騙就下降了 94%！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="997" y="7513" font-size="212" textLength="3438" lengthAdjust="spacingAndGlyphs">這就是我們如何同時兼顧責任與自主！</tspan></text></g></svg>
