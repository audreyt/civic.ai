<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5742 8000" width="1437" height="1999" lang="zh-Hant-TW"><title>五：團結力 — 問題</title><desc>手繪漫畫頁，標題為「團結力——PROBLEM」：當大家想要不同的東西，我們往往陷入「負和」或「零和」思維——兩位廚師都想要同一顆橘子，他們可以爭奪而兩敗俱傷（負和），或平分但仍假設一方所得即另一方所失（零和）；下方是一張輸贏對照圖。</desc><style>text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack5-1-tw-2874w.avif" width="5742" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="sans-serif" fill-opacity="0"><tspan x="2408" y="923.5" font-size="718.5" textLength="1975" lengthAdjust="spacingAndGlyphs">團結力</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="373" y="1779.4" font-size="407.6" textLength="1047" lengthAdjust="spacingAndGlyphs">問題：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1820" y="1592.4" font-size="189.1" textLength="3085" lengthAdjust="spacingAndGlyphs">每當大家想要不同的東西，我們往往陷</tspan><tspan x="1818" y="1808.9" font-size="189.1" textLength="2487" lengthAdjust="spacingAndGlyphs">入：「負和」或「零和」思維。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="439" y="2230.5" font-size="143.5" textLength="2250" lengthAdjust="spacingAndGlyphs">這是什麼意思？想像兩位都想要一顆</tspan><tspan x="441" y="2396.5" font-size="143.5" textLength="1021" lengthAdjust="spacingAndGlyphs">橘子的廚師 ——</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3038" y="2216.3" font-size="145.7" textLength="2192" lengthAdjust="spacingAndGlyphs">他們可以為之爭鬥，結果兩敗俱傷：「</tspan><tspan x="3102" y="2383.3" font-size="145.7" textLength="579" lengthAdjust="spacingAndGlyphs">負和」。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="388" y="4980.9" font-size="144.6" textLength="2389" lengthAdjust="spacingAndGlyphs">平分橘子比較好，但這仍假設我的所得</tspan><tspan x="391" y="5146.4" font-size="144.6" textLength="1944" lengthAdjust="spacingAndGlyphs">是你的所失：收益加總為零：「</tspan><tspan x="389" y="5313.9" font-size="144.6" textLength="503" lengthAdjust="spacingAndGlyphs">零和」。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="2979" y="4878.7" font-size="154.3" textLength="2079" lengthAdjust="spacingAndGlyphs">但他們能雙方都獲益嗎？也就是</tspan><tspan x="3049" y="5061.7" font-size="154.3" textLength="2055" lengthAdjust="spacingAndGlyphs">「正和」? 這也許不總是辦得到，</tspan><tspan x="2979" y="5244.2" font-size="154.3" textLength="2026" lengthAdjust="spacingAndGlyphs">但錯失良機就太可惜了。那麼，</tspan><tspan x="2976" y="5428.7" font-size="154.3" textLength="2034" lengthAdjust="spacingAndGlyphs">該如何盡可能追求「雙贏」呢 ?</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="902" y="7622" font-size="100" textLength="3053" lengthAdjust="spacingAndGlyphs">*這個橘子故事源自 Follett (1925)、Fisher &amp; Ury (1981) 與 Covey (1989)</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3776" y="5750.4" font-size="107.6" textLength="200" lengthAdjust="spacingAndGlyphs">我贏</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="5015" y="6351.3" font-size="108.7" textLength="196" lengthAdjust="spacingAndGlyphs">你贏</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3197" y="6641.3" font-size="108.7" textLength="191" lengthAdjust="spacingAndGlyphs">你輸</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3776" y="7251.3" font-size="108.7" textLength="197" lengthAdjust="spacingAndGlyphs">我輸</tspan></text></g></svg>
