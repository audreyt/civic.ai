<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5742 8000" width="1437" height="1999" lang="zh-Hant-TW"><title>四：回應力 — 解方</title><desc>手繪漫畫頁，標題為「NOT：metrics that mislead us／BUT：metrics made by us, for us——SOLUTION」：列出三步驟——衡量我們真正在乎的事、用多種方式衡量、經常重新評估指標——並以 Weval.org 為例，那是一個公開的 AI 聊天機器人評估集合，衡量誠實、文化流暢度、衝突調解與心理健康最佳實務等價值，綠色的「BY US」與「FOR US」箭頭從一群動物角色上方升起。</desc><style>text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack4-2-tw-2874w.avif" width="5742" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="sans-serif" fill-opacity="0"><tspan x="1475" y="460.1" font-size="285.9" textLength="2800" lengthAdjust="spacingAndGlyphs">不是：誤導我們的指標</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="751" y="913.6" font-size="292.4" textLength="4335" lengthAdjust="spacingAndGlyphs">而是：由我們、為我們而做的指標</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="333" y="1750.8" font-size="415.2" textLength="1049" lengthAdjust="spacingAndGlyphs">解方：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="289" y="2253.1" font-size="210.9" textLength="2408" lengthAdjust="spacingAndGlyphs">1. 衡量我們真正在乎的事。</tspan><tspan x="282" y="2502.6" font-size="210.9" textLength="1790" lengthAdjust="spacingAndGlyphs">2. 用多種方式衡量。</tspan><tspan x="281" y="2753.1" font-size="210.9" textLength="1999" lengthAdjust="spacingAndGlyphs">3. 經常重新評估指標。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="331" y="3577.4" font-size="151.1" textLength="373" lengthAdjust="spacingAndGlyphs">想想：</tspan><tspan x="331" y="3762.4" font-size="151.1" textLength="1110" lengthAdjust="spacingAndGlyphs">為 AI 聊天機器人</tspan><tspan x="330" y="3944.9" font-size="151.1" textLength="1181" lengthAdjust="spacingAndGlyphs">打造的評測集合，</tspan><tspan x="335" y="4128.9" font-size="151.1" textLength="1126" lengthAdjust="spacingAndGlyphs">由公眾設計、</tspan><tspan x="333" y="4312.9" font-size="151.1" textLength="819" lengthAdjust="spacingAndGlyphs">為公眾而做！</tspan><tspan x="324" y="4503.4" font-size="151.1" textLength="1386" lengthAdjust="spacingAndGlyphs">(比如Weval.org，</tspan><tspan x="330" y="4678.9" font-size="151.1" textLength="783" lengthAdjust="spacingAndGlyphs">我們需要更多 ...)</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="333" y="5245.8" font-size="158.7" textLength="928" lengthAdjust="spacingAndGlyphs">產業多半追蹤</tspan><tspan x="326" y="5436.8" font-size="158.7" textLength="980" lengthAdjust="spacingAndGlyphs">AI 的能力，而</tspan><tspan x="334" y="5629.3" font-size="158.7" textLength="930" lengthAdjust="spacingAndGlyphs">羅盤衡量的是</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="344" y="6396.2" font-size="159.8" textLength="1299" lengthAdjust="spacingAndGlyphs">人們所重視的 ——</tspan><tspan x="343" y="6587.2" font-size="159.8" textLength="1354" lengthAdjust="spacingAndGlyphs">誠實、文化流暢度、</tspan><tspan x="343" y="6779.7" font-size="159.8" textLength="721" lengthAdjust="spacingAndGlyphs">衝突調解、</tspan><tspan x="342" y="6971.7" font-size="159.8" textLength="1383" lengthAdjust="spacingAndGlyphs">心理健康最佳實務…</tspan><tspan x="343" y="7161.7" font-size="159.8" textLength="711" lengthAdjust="spacingAndGlyphs">諸如此類！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3929" y="3589.2" font-size="159.8" textLength="1245" lengthAdjust="spacingAndGlyphs">每項價值都以多種</tspan><tspan x="3935" y="3781.2" font-size="159.8" textLength="1397" lengthAdjust="spacingAndGlyphs">不同方式衡量，以</tspan><tspan x="3929" y="3973.7" font-size="159.8" textLength="404" lengthAdjust="spacingAndGlyphs">求穩健。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3932" y="5072.2" font-size="159.8" textLength="1184" lengthAdjust="spacingAndGlyphs">而且有回饋循環：</tspan><tspan x="3943" y="5263.7" font-size="159.8" textLength="1544" lengthAdjust="spacingAndGlyphs">由公民評估，這些評測</tspan><tspan x="3928" y="5455.2" font-size="159.8" textLength="1197" lengthAdjust="spacingAndGlyphs">可以被加以改進。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="3891" y="6380.2" font-size="159.8" textLength="1232" lengthAdjust="spacingAndGlyphs">這就是我們設計了</tspan><tspan x="3893" y="6572.7" font-size="159.8" textLength="1493" lengthAdjust="spacingAndGlyphs">以價值為本的「羅盤」</tspan><tspan x="3893" y="6764.2" font-size="159.8" textLength="1344" lengthAdjust="spacingAndGlyphs">來引導科技的方法！</tspan></text></g></svg>
