<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 2: Responsibility — Problem</title><desc>Hand-drawn comic page headed 'RESPONSIBILITY — PROBLEM': a huddle of cartoon animals each shout a blame-shifting excuse such as 'I'm just selling what the customers buy' and 'I'm just following orders', under the line 'When no one is responsible, no one is responsible', with a caption on Taiwan's 2024 Facebook deepfake scams quoting the platform's deflection, 'it's an algorithm pushing to you'.</desc><style>@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack2-1-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack2-1-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1186" y="771.2" font-size="781.1" textLength="4410" lengthAdjust="spacingAndGlyphs">RESPONSIBILITY</tspan></text><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="377" y="1680.4" font-size="421.1" textLength="1329" lengthAdjust="spacingAndGlyphs">PROBLEM:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="210.4" fill="#000000"><text><tspan x="1962.7" y="1531">Great projects&#32;</tspan><tspan x="3103" y="1531">often need great numbers of&#32;</tspan><tspan x="1962.4" y="1770.5">people... but great numbers&#32;</tspan><tspan x="4091.4" y="1770.5">of&#32;</tspan><tspan x="4299.1" y="1770.5">people often&#32;</tspan><tspan x="1963.1" y="2000.5">lead&#32;</tspan><tspan x="2314.7" y="2000.5">to great amounts of&#32;</tspan><tspan x="3880.8" y="2000.5">shifting&#32;</tspan><tspan x="4528.4" y="2000.5">blame.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="240.3" fill="#000000"><text><tspan x="701" y="2384">When&#32;</tspan><tspan x="1208.4" y="2384">no&#32;</tspan></text><text transform="matrix(1 0 -0.35 1 834.4 0)"><tspan x="1455.1" y="2384">one&#32;</tspan></text><text><tspan x="1851.5" y="2384">is&#32;</tspan><tspan x="2050.1" y="2384">responsible,</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="239.7" fill="#000000"><text transform="matrix(1 0 -0.35 1 830.9 0)"><tspan x="3146.5" y="2374">no&#32;</tspan></text><text transform="matrix(1 0 -0.35 1 830.9 0)"><tspan x="3420.5" y="2374">one</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="239.3" fill="#000000"><text><tspan x="3814" y="2383.8">is responsible.</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1820" y="3130.3" font-size="216.8" textLength="893" lengthAdjust="spacingAndGlyphs">I’m just buying&#32;</tspan><tspan x="1766" y="3290" font-size="241.1" textLength="1037" lengthAdjust="spacingAndGlyphs">what I can afford&#32;</tspan><tspan x="1852" y="3474.9" font-size="236.8" textLength="904" lengthAdjust="spacingAndGlyphs">with my wages!</tspan></text><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="4080" y="3396" font-size="313.7" textLength="606" lengthAdjust="spacingAndGlyphs">I’m just paying&#32;</tspan><tspan x="4220" y="3587.8" font-size="273.7" textLength="868" lengthAdjust="spacingAndGlyphs">workers the wages&#32;</tspan><tspan x="4247" y="3801.9" font-size="295.8" textLength="890" lengthAdjust="spacingAndGlyphs">set by the&#32;</tspan><tspan x="4242" y="3988.7" font-size="251.6" textLength="581" lengthAdjust="spacingAndGlyphs">market!</tspan></text><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="606" y="3836.7" font-size="242.1" textLength="1085" lengthAdjust="spacingAndGlyphs">I’m just selling on&#32;</tspan><tspan x="667" y="3988.7" font-size="251.6" textLength="1000" lengthAdjust="spacingAndGlyphs">the market what&#32;</tspan><tspan x="746" y="4174.9" font-size="191.6" textLength="881" lengthAdjust="spacingAndGlyphs">the customers&#32;</tspan><tspan x="1084" y="4362.4" font-size="193.7" textLength="248" lengthAdjust="spacingAndGlyphs">buy!</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="152.3" fill="#000000"><text><tspan x="4140.2" y="4323.7">a</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="3978" y="4857.7" font-size="237.9" textLength="866" lengthAdjust="spacingAndGlyphs">I’m just giving&#32;</tspan><tspan x="3961" y="5021.6" font-size="274.7" textLength="945" lengthAdjust="spacingAndGlyphs">the voters what&#32;</tspan><tspan x="4150" y="5205.4" font-size="238.9" textLength="626" lengthAdjust="spacingAndGlyphs">they want.</tspan></text><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1094" y="5075.1" font-size="308.4" textLength="785" lengthAdjust="spacingAndGlyphs">I’m just voting&#32;</tspan><tspan x="1081" y="5265" font-size="286.3" textLength="874" lengthAdjust="spacingAndGlyphs">for the lesser&#32;</tspan><tspan x="1097" y="5440.3" font-size="248.4" textLength="723" lengthAdjust="spacingAndGlyphs">of the evils!</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="177.9" fill="#000000"><text><tspan x="715.4" y="6301.9">For&#32;</tspan><tspan x="966.2" y="6301.9">example:&#32;</tspan><tspan x="1572.8" y="6301.9">in&#32;</tspan><tspan x="1729.9" y="6301.9">2024,&#32;</tspan><tspan x="2118.7" y="6301.9">Taiwan's&#32;</tspan><tspan x="2687.6" y="6301.9">Facebook&#32;</tspan><tspan x="3298.3" y="6301.9">feeds&#32;</tspan><tspan x="3681.5" y="6301.9">were&#32;</tspan><tspan x="4017.9" y="6301.9">flooded&#32;</tspan><tspan x="4523.9" y="6301.9">with AI-</tspan><tspan x="711.2" y="6498.9">generated&#32;</tspan><tspan x="1389.9" y="6498.9">scams.&#32;</tspan><tspan x="1860.6" y="6498.9">Realistic&#32;</tspan><tspan x="2452.5" y="6498.9">deepfake&#32;</tspan><tspan x="3060.7" y="6498.9">videos,&#32;</tspan><tspan x="3519.9" y="6498.9">such&#32;</tspan><tspan x="3845.2" y="6498.9">as&#32;</tspan><tspan x="4027.3" y="6498.9">those&#32;</tspan><tspan x="4416.1" y="6498.9">of&#32;</tspan><tspan x="4594.6" y="6498.9">Jensen&#32;</tspan><tspan x="558.2" y="6695.9">Huang--the&#32;</tspan><tspan x="1336.3" y="6695.9">founder of&#32;</tspan><tspan x="2050.4" y="6695.9">Nvidia--tricked&#32;</tspan><tspan x="3071.2" y="6695.9">people out&#32;</tspan><tspan x="3776" y="6695.9">of&#32;</tspan><tspan x="3953.4" y="6695.9">millions&#32;</tspan><tspan x="4508.2" y="6695.9">of&#32;</tspan><tspan x="4687.7" y="6695.9">dollars.&#32;</tspan><tspan x="984.4" y="6892.9">Facebook</tspan><tspan x="1552.1" y="6893.9">'</tspan><tspan x="1581.3" y="6892.9">s&#32;</tspan><tspan x="1686.7" y="6892.9">response,&#32;</tspan><tspan x="2330.8" y="6892.9">in&#32;</tspan><tspan x="2489" y="6892.9">effect?&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1378.6 0)"><tspan x="2984.9" y="6892.9">We didn</tspan></text><text transform="matrix(1 0 -0.2 1 1378.6 0)"><tspan x="3465.2" y="6893.9">'</tspan></text><text transform="matrix(1 0 -0.2 1 1378.6 0)"><tspan x="3493.4" y="6892.9">t&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1378.6 0)"><tspan x="3612.5" y="6892.9">come&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1378.6 0)"><tspan x="3984.9" y="6892.9">up&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1378.6 0)"><tspan x="4176.1" y="6892.9">with&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1378.6 0)"><tspan x="4474.1" y="6892.9">that&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1418.2 0)"><tspan x="567" y="7090.9">advertisement;&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1418.2 0)"><tspan x="1570.5" y="7090.9">it&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1418.2 0)"><tspan x="1726.4" y="7090.9">is&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1418.2 0)"><tspan x="1881.7" y="7090.9">our&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1418.2 0)"><tspan x="2146.9" y="7090.9">algorithm&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1418.2 0)"><tspan x="2836.9" y="7090.9">pushing&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1418.2 0)"><tspan x="3364.7" y="7090.9">to&#32;</tspan></text><text transform="matrix(1 0 -0.2 1 1418.2 0)"><tspan x="3544.5" y="7090.9">you.&#32;</tspan></text><text><tspan x="3836.6" y="7090.9">No&#32;</tspan><tspan x="4042.9" y="7090.9">liability&#32;</tspan><tspan x="4578.4" y="7090.9">assumed.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="209.4" fill="#000000"><text><tspan x="880.6" y="7509.7">&quot;</tspan><tspan x="945.1 994.3" y="7510.7">I'</tspan><tspan x="1029.6 1172" y="7510.7">m&#32;</tspan><tspan x="1220.2 1270.4 1354.2 1434.8 1506.8" y="7510.7">just&#32;</tspan><tspan x="1556 1631.2 1715.6 1772.3 1828 1912.4 2010.3 2057.2 2151.9 2244.1" y="7510.7">following&#32;</tspan><tspan x="2294.2 2378.6 2459.2 2540.9 2625.3 2706.9 2787.5 2876.1 2923 3017.6 3099.9 3183.2 3277.9 3349.9 3397.8 3481.6 3565.9 3646.6 3736.1 3819.5 3903.3 3987.6 4069.2 4157.8 4242.2 4337.8 4415.2" y="7510.7">orders/incentives/everyone&#32;</tspan><tspan x="4469.3 4553.7 4609.4 4690 4774.4" y="7510.7">else.</tspan><tspan x="4819.2" y="7509.7">&quot;</tspan></text></g></g></svg>
