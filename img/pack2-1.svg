<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 2: Responsibility — Problem</title><desc>Hand-drawn comic page headed 'RESPONSIBILITY — PROBLEM': a huddle of cartoon animals each shout a blame-shifting excuse such as 'I'm just selling what the customers buy' and 'I'm just following orders', under the line 'When no one is responsible, no one is responsible', with a caption on Taiwan's 2024 Facebook deepfake scams quoting the platform's deflection, 'it's an algorithm pushing to you'.</desc><style>@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack2-1-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack2-1-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1186" y="771.2" font-size="781.1" textLength="4410" lengthAdjust="spacingAndGlyphs">RESPONSIBILITY</tspan></text><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="377" y="1680.4" font-size="421.1" textLength="1329" lengthAdjust="spacingAndGlyphs">PROBLEM:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="210.5" fill="#000000"><text><tspan x="1962.7" y="1531">Great&#32;</tspan><tspan x="2430.9" y="1531">projects often&#32;</tspan><tspan x="3562.6" y="1531">need great numbers&#32;</tspan><tspan x="5119.8" y="1531">of&#32;</tspan><tspan x="1962.4" y="1771">people... but great numbers of people often&#32;</tspan><tspan x="1963.1" y="2000.5">leads to great&#32;</tspan><tspan x="3062.2" y="2000.5">amounts of&#32;</tspan><tspan x="3961.6" y="2000.5">shifting blame.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="240.3" fill="#000000"><text><tspan x="697" y="2384">When&#32;</tspan><tspan x="1204.4" y="2384">no&#32;</tspan></text><text transform="matrix(1 0 -0.35 1 834.4 0)"><tspan x="1451.1" y="2384">one&#32;</tspan></text><text><tspan x="1847.5" y="2384">is&#32;</tspan><tspan x="2046.1" y="2384">responsible,</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="250" fill="#000000"><text transform="matrix(1 0 -0.35 1 832 0)"><tspan x="3143.8 3251.8 3355.6" y="2377">no&#32;</tspan></text><text transform="matrix(1 0 -0.35 1 832 0)"><tspan x="3418.1 3513.8 3622.8" y="2377">one</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="239.3" fill="#000000"><text><tspan x="3817" y="2383.8">is responsible.</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1820" y="3130.3" font-size="216.8" textLength="893" lengthAdjust="spacingAndGlyphs">I’m just buying&#32;</tspan><tspan x="1766" y="3290" font-size="241.1" textLength="1037" lengthAdjust="spacingAndGlyphs">what I can afford&#32;</tspan><tspan x="1852" y="3474.9" font-size="236.8" textLength="904" lengthAdjust="spacingAndGlyphs">with my wages!</tspan></text><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="4080" y="3396" font-size="313.7" textLength="606" lengthAdjust="spacingAndGlyphs">I’m just paying&#32;</tspan><tspan x="4220" y="3587.8" font-size="273.7" textLength="868" lengthAdjust="spacingAndGlyphs">workers the wages&#32;</tspan><tspan x="4247" y="3801.9" font-size="295.8" textLength="890" lengthAdjust="spacingAndGlyphs">set by the&#32;</tspan><tspan x="4242" y="3988.7" font-size="251.6" textLength="581" lengthAdjust="spacingAndGlyphs">market!</tspan></text><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="606" y="3836.7" font-size="242.1" textLength="1085" lengthAdjust="spacingAndGlyphs">I’m just selling on&#32;</tspan><tspan x="667" y="3988.7" font-size="251.6" textLength="1000" lengthAdjust="spacingAndGlyphs">the market what&#32;</tspan><tspan x="746" y="4174.9" font-size="191.6" textLength="881" lengthAdjust="spacingAndGlyphs">the customers&#32;</tspan><tspan x="1084" y="4362.4" font-size="193.7" textLength="248" lengthAdjust="spacingAndGlyphs">buy!</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="152.3" fill="#000000"><text><tspan x="4140.2" y="4323.7">a</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="3978" y="4857.7" font-size="237.9" textLength="866" lengthAdjust="spacingAndGlyphs">I’m just giving&#32;</tspan><tspan x="3961" y="5021.6" font-size="274.7" textLength="945" lengthAdjust="spacingAndGlyphs">the voters what&#32;</tspan><tspan x="4150" y="5205.4" font-size="238.9" textLength="626" lengthAdjust="spacingAndGlyphs">they want.</tspan></text><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1094" y="5075.1" font-size="308.4" textLength="785" lengthAdjust="spacingAndGlyphs">I’m just voting&#32;</tspan><tspan x="1081" y="5265" font-size="286.3" textLength="874" lengthAdjust="spacingAndGlyphs">for the lesser&#32;</tspan><tspan x="1097" y="5440.3" font-size="248.4" textLength="723" lengthAdjust="spacingAndGlyphs">of the evils!</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="552.4" y="6306.6">For example: in&#32;</tspan><tspan x="1655.5" y="6306.6">2024, Taiwan'</tspan><tspan x="2562.5" y="6306.6">s Facebook feeds were&#32;</tspan><tspan x="4106.5" y="6306.6">flooded with AI-</tspan><tspan x="582.5" y="6518.1">generated&#32;</tspan><tspan x="1314.6" y="6518.1">scams. Realistic deepfake videos of Jensen Huang --&#32;</tspan><tspan x="4933.2" y="6518.1">the&#32;</tspan><tspan x="512.8" y="6730.1">Taiwanese CEO of Nvidia&#32;</tspan><tspan x="2226.4" y="6730.1">-- tricked&#32;</tspan><tspan x="2978.7" y="6730.1">people out of millions of dollars.&#32;</tspan><tspan x="462.4" y="6942.1">Facebook's response?&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 1735.5 0)"><tspan x="1946.1" y="6943.1">&quot;</tspan></text><text transform="matrix(1 0 -0.25 1 1735.5 0)"><tspan x="2004.1" y="6942.1">We didn</tspan></text><text transform="matrix(1 0 -0.25 1 1735.5 0)"><tspan x="2521.6" y="6942.1">'</tspan></text><text transform="matrix(1 0 -0.25 1 1735.5 0)"><tspan x="2552" y="6942.1">t&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 1735.5 0)"><tspan x="2660.8" y="6942.1">come&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 1735.5 0)"><tspan x="3063.4" y="6942.1">up with that&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 1735.5 0)"><tspan x="3917.4" y="6942.1">advertisement; it&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 1735.5 0)"><tspan x="5150.4" y="6942.1">is&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 1788.4 0)"><tspan x="865.9 943 1019.6 1093.2 1137.2 1213.2 1261.1 1348.2 1425.3 1500 1542.9 1607.7 1687 1818.1 1861.1 1944 2020.5 2095.2 2175.6 2217.4 2302.9 2389 2435 2498.8 2575.9 2619 2700.9 2778 2852.5" y="7153.6">our algorithm pushing to you.</tspan></text><text transform="matrix(1 0 -0.25 1 1788.4 0)"><tspan x="2901.5 2959.4" y="7152.6">&quot;&#32;</tspan></text><text><tspan x="3017.4 3119.2 3196.3 3240.3 3314 3390.1 3464.8 3545.7 3623.8 3709.2 3782.9 3825.8 3904.6 3947.4 3998.3 4040.2 4106 4187.9" y="7153.6">No responsibility&#32;</tspan><tspan x="4230.9 4305.9 4379.6 4453.2 4529.8 4660.9 4737 4811.6" y="7153.6">assumed.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="209.4" fill="#000000"><text><tspan x="880.6" y="7509.7">&quot;</tspan><tspan x="945.1 994.3" y="7510.7">I'</tspan><tspan x="1029.6 1172" y="7510.7">m&#32;</tspan><tspan x="1220.2 1270.4 1354.2 1434.8 1506.8" y="7510.7">just&#32;</tspan><tspan x="1556 1631.2 1715.6 1772.3 1828 1912.4 2010.3 2057.2 2151.9 2244.1" y="7510.7">following&#32;</tspan><tspan x="2294.2 2378.6 2459.2 2540.9 2625.3 2706.9 2787.5 2876.1 2923 3017.6 3099.9 3183.2 3277.9 3349.9 3397.8 3481.6 3565.9 3646.6 3736.1 3819.5 3903.3 3987.6 4069.2 4157.8 4242.2 4337.8 4415.2" y="7510.7">orders/incentives/everyone&#32;</tspan><tspan x="4469.3 4553.7 4609.4 4690 4774.4" y="7510.7">else.</tspan><tspan x="4819.2" y="7509.7">&quot;</tspan></text></g></g></svg>
