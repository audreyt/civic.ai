<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 5: Solidarity — Solution</title><desc>Hand-lettered comic page headed 'NOT: mutually assured destruction, BUT: as win-win as possible — SOLUTION': look behind each what to the deeper why, then craft a new what that satisfies both sides — the two chefs discover one needs the orange peel for liqueur and the other the juice, so both are fully satisfied with no waste; and Taiwan used the pol.is platform to turn divisive debates into win-wins — including the Employment Gold Card that welcomed scientists and artists, showing how better conversations help everyone gain.</desc><style>@font-face{font-family:"Patrick Hand SC";src:url(/fonts/patrick-hand-sc-comics.woff2) format("woff2");font-display:block}@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack5-2-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack5-2-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="426.1" letter-spacing="-7.9" fill="#000000"><text><tspan x="307.1" y="503.7">not:&#32;</tspan><tspan x="1028" y="503.7">mutually assured destruction</tspan></text></g><g font-family="'Patrick Hand SC','Patrick Hand','Chalkboard SE','Comic Neue',cursive" font-size="424.2" fill="#000000"><text><tspan x="844" y="876.6">but: as win-win as&#32;</tspan><tspan x="3683.2" y="876.6">possible</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="362" y="1658.3" font-size="416.8" textLength="1377" lengthAdjust="spacingAndGlyphs">SOLUTION:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="1921.8" y="1479.1">Take a step back.&#32;</tspan><tspan x="3137.8" y="1479.1">Behind the&#32;</tspan><tspan x="3906.5" y="1479.1">WHAT you want,&#32;</tspan><tspan x="5016.8" y="1479.1">ask&#32;</tspan><tspan x="1922.6" y="1691">yourselves: WHY do you want it? Then:&#32;</tspan><tspan x="4559.2" y="1691">can you&#32;</tspan><tspan x="1922.4" y="1902.5">create&#32;</tspan><tspan x="2406.4" y="1902.5">a new WHAT that fulfils&#32;</tspan></text><text transform="matrix(1 0 -0.3 1 570.8 0)"><tspan x="4063" y="1902.5">both&#32;</tspan></text><text><tspan x="4444.1" y="1902.5">your WHYs?</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="419.4" y="2207.7">For example, maybe our two&#32;</tspan><tspan x="2376.3" y="2207.7">chefs&#32;</tspan><tspan x="419.5" y="2418.6">say to each other...</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="133.6" fill="#000000"><text><tspan x="1118.8" y="2864">I need to&#32;</tspan><tspan x="1560.2" y="2864">make&#32;</tspan><tspan x="1099.7" y="2998">orange&#32;</tspan><tspan x="1460.2" y="2998">liqueur.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="133.7" fill="#000000"><text><tspan x="1386.4" y="3395.4">Oh! I&#32;</tspan><tspan x="1641.7" y="3395.4">need&#32;</tspan><tspan x="1318.7" y="3529.9">orange juice.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="3005.5" y="2208">...and they realise, they can&#32;</tspan><tspan x="4932.2" y="2208">both&#32;</tspan><tspan x="3006.5" y="2418.2">get 100% of their needs, no&#32;</tspan><tspan x="4935" y="2418.2">waste!</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="143.5" fill="#000000"><text><tspan x="3712.1" y="2825.3">peels &amp;&#32;</tspan><tspan x="4122.3" y="2825.3">zest&#32;</tspan><tspan x="3751" y="2987.9">for&#32;</tspan><tspan x="3947.6" y="2987.9">liqueur</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="143.7" fill="#000000"><text><tspan x="4195.1" y="3204">pulp&#32;</tspan><tspan x="4445.8" y="3204">for&#32;</tspan><tspan x="4281.5" y="3367.2">juice</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="420.2" y="4602.6">Yes,&#32;</tspan><tspan x="736.1" y="4602.6">that's contrived, but&#32;</tspan><tspan x="2165.9" y="4602.6">win-wins&#32;</tspan><tspan x="419.4" y="4813.3">can often be found in&#32;</tspan><tspan x="1915.6" y="4813.3">real life! A&#32;</tspan><tspan x="420" y="5024">few years back,&#32;</tspan><tspan x="1509.6" y="5024">Taiwan had an&#32;</tspan><tspan x="420.2" y="5235.6">angry debate about whether to&#32;</tspan><tspan x="421.4" y="5445.1">change its time zone:</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="143.6" fill="#000000"><text><tspan x="592" y="5867.9">CHANGE:&#32;</tspan><tspan x="593" y="6030.9">to&#32;</tspan><tspan x="732.3" y="6030.9">make&#32;</tspan><tspan x="591.9" y="6193.3">Taiwan&#32;</tspan><tspan x="592.3" y="6366.1">more&#32;</tspan><tspan x="592" y="6529">unique</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="143.3" fill="#000000"><text><tspan x="2393.3" y="5857.6">KEEP:&#32;</tspan><tspan x="2029.3" y="6020.9">because time&#32;</tspan><tspan x="1942.6" y="6183.9">zone change is&#32;</tspan><tspan x="2029.1" y="6356.2">economically&#32;</tspan><tspan x="2383.6" y="6519">costly</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.5" fill="#000000"><text><tspan x="2997.3" y="4603.7">But with&#32;</tspan><tspan x="3600.8" y="4603.7">the help of&#32;</tspan></text><text transform="matrix(1 0 -0.25 1 1150.9 0)"><tspan x="4396.9" y="4603.7">pol.is&#32;</tspan></text><text><tspan x="4840.7" y="4603.7">and&#32;</tspan><tspan x="2996.1" y="4814.1">participation&#32;</tspan><tspan x="3924.5" y="4814.1">officers, folks&#32;</tspan><tspan x="4955.8" y="4814.1">found&#32;</tspan><tspan x="2997.2" y="5026.8">a new WHAT to&#32;</tspan><tspan x="4031.6" y="5026.8">fulfil mutual WHYs:&#32;</tspan><tspan x="2996.7" y="5237.7">the Gold Card residency,&#32;</tspan><tspan x="4715.5" y="5237.7">to&#32;</tspan><tspan x="4901.6" y="5237.7">bring&#32;</tspan><tspan x="2996.5" y="5449.7">scientists&#32;</tspan><tspan x="3715.3" y="5449.7">&amp;&#32;</tspan><tspan x="3859.9" y="5449.7">artists to&#32;</tspan><tspan x="4560.9" y="5449.7">Taiwan.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="144" fill="#000000"><text><tspan x="3386" y="5947.1">for</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="143.5" fill="#000000"><text><tspan x="3120" y="6206">UNIQUENESS</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="3364" y="6519.6" font-size="233.7" textLength="274" lengthAdjust="spacingAndGlyphs">and</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="143.5" fill="#000000"><text><tspan x="3150.1" y="6797.2">ECONOMICS</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="143.9" fill="#000000"><text><tspan x="3389" y="7078">???</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="4319" y="6015.7" font-size="196.8" textLength="702" lengthAdjust="spacingAndGlyphs">welcome,&#32;</tspan><tspan x="4328" y="6222.7" font-size="269.5" textLength="770" lengthAdjust="spacingAndGlyphs">Creators!</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="192.6" fill="#000000"><text transform="matrix(1 0 -0.3 1 2283.6 0)"><tspan x="1058" y="7611.9">That</tspan></text><text transform="matrix(1 0 -0.3 1 2283.6 0)"><tspan x="1367.8" y="7611.9">'</tspan></text><text transform="matrix(1 0 -0.3 1 2283.6 0)"><tspan x="1400.4" y="7611.9">s&#32;</tspan></text><text><tspan x="1543.8" y="7611.9">how&#32;</tspan><tspan x="1833.8" y="7611.9">better&#32;</tspan><tspan x="2313.5" y="7611.9">discussion&#32;</tspan><tspan x="3054.1" y="7611.9">can&#32;</tspan><tspan x="3333.7" y="7611.9">help&#32;</tspan><tspan x="3667.2" y="7611.9">us&#32;</tspan><tspan x="3861.7" y="7611.9">get&#32;</tspan><tspan x="4132.6" y="7611.9">to&#32;</tspan><tspan x="4317.8" y="7611.9">win-win!</tspan></text></g></g></svg>
