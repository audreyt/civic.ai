<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5742 8000" width="1437" height="1999" lang="zh-Hant-TW"><title>三：勝任力 — 解方</title><desc>手繪漫畫頁，標題為「NOT：just trust us lol／BUT：everyone can check the process——SOLUTION」：影響每個人的演算法應讓每個人都能檢視，並以 X 上的 Community Notes（前身為 Birdwatch）為例，三隻動物角色分別檢核輸入、自由且公開的程式碼（標示「MY CODE」的清單）以及輸出，結語為「要『信任流程』，我們得能夠檢查流程」。</desc><style>text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack3-2-tw-2874w.avif" width="5742" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="sans-serif" fill-opacity="0"><tspan x="1385" y="465.8" font-size="290.2" textLength="2943" lengthAdjust="spacingAndGlyphs">不要「相信我們就好啦」</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1532" y="891" font-size="287" textLength="2795" lengthAdjust="spacingAndGlyphs">而要人人都能檢查流程</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="333" y="1750.8" font-size="415.2" textLength="1049" lengthAdjust="spacingAndGlyphs">解方：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1834" y="1536.7" font-size="228.3" textLength="3121" lengthAdjust="spacingAndGlyphs">這些影響每個人的演算法，應該</tspan><tspan x="1835" y="1802.2" font-size="228.3" textLength="1462" lengthAdjust="spacingAndGlyphs">人人都能檢視！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="473" y="2396.7" font-size="179.3" textLength="4744" lengthAdjust="spacingAndGlyphs">想想 X 上的 Community Notes（前身是 Twitter 的 Birdwat</tspan><tspan x="473" y="2594.7" font-size="179.3" textLength="4298" lengthAdjust="spacingAndGlyphs">ch）。</tspan><tspan x="498" y="2803.7" font-size="179.3" textLength="4846" lengthAdjust="spacingAndGlyphs">它的運作方式，是凸顯出通常意見相左的人都認同之處。</tspan><tspan x="476" y="3011.7" font-size="179.3" textLength="1832" lengthAdjust="spacingAndGlyphs">目前為止，它是唯一在美國政治光譜上各方都獲得淨正面評價的主要「事實查核」平台！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="477" y="3397.4" font-size="176.1" textLength="1727" lengthAdjust="spacingAndGlyphs">一部分的原因，是任何</tspan><tspan x="473" y="3605.9" font-size="176.1" textLength="1729" lengthAdjust="spacingAndGlyphs">人都能檢查演算法的任</tspan><tspan x="477" y="3813.9" font-size="176.1" textLength="1726" lengthAdjust="spacingAndGlyphs">一環節。使用者能看見</tspan><tspan x="474" y="4022.4" font-size="176.1" textLength="788" lengthAdjust="spacingAndGlyphs">所有輸入：</tspan><tspan x="473" y="4229.9" font-size="176.1" textLength="1500" lengthAdjust="spacingAndGlyphs">使用者提交的註記。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="473" y="4798.9" font-size="176.1" textLength="1724" lengthAdjust="spacingAndGlyphs">使用者能檢查註記是否</tspan><tspan x="474" y="5007.4" font-size="176.1" textLength="963" lengthAdjust="spacingAndGlyphs">被正確分析：</tspan><tspan x="475" y="5216.4" font-size="176.1" textLength="1323" lengthAdjust="spacingAndGlyphs">程式碼開放公開。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="477" y="5919.3" font-size="177.2" textLength="1660" lengthAdjust="spacingAndGlyphs">最後，使用者能檢查：</tspan><tspan x="474" y="6128.8" font-size="177.2" textLength="1729" lengthAdjust="spacingAndGlyphs">被凸顯出的註記，的確</tspan><tspan x="473" y="6336.8" font-size="177.2" textLength="1730" lengthAdjust="spacingAndGlyphs">都是意見相左的人都認</tspan><tspan x="489" y="6544.3" font-size="177.2" textLength="609" lengthAdjust="spacingAndGlyphs">同之處。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="628" y="7348.4" font-size="207.6" textLength="3870" lengthAdjust="spacingAndGlyphs">Community Notes 只是眾多範例之一！重點在於：</tspan><tspan x="630" y="7554.4" font-size="207.6" textLength="3770" lengthAdjust="spacingAndGlyphs">若要「信任流程」，我們就必須能夠檢查流程。</tspan></text></g></svg>
