<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5742 8000" width="1437" height="1999" lang="zh-Hant-TW"><title>二：負責力 — 問題</title><desc>手繪漫畫頁，標題為「RESPONSIBILITY——PROBLEM」：一群卡通動物擠在一起、各自喊出推卸責任的藉口，例如「我只是賣顧客要買的東西」與「我只是聽命行事」，下方寫著「沒有人負責時，就沒有人負責」，並以說明文字記述臺灣 2024 年臉書深偽詐騙案，引用平台卸責的回應「是演算法推送給你的」。</desc><style>text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack2-1-tw-2874w.avif" width="5742" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="sans-serif" fill-opacity="0"><tspan x="2361" y="886.4" font-size="682.6" textLength="1894" lengthAdjust="spacingAndGlyphs">負責力</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="373" y="1779.4" font-size="407.6" textLength="1047" lengthAdjust="spacingAndGlyphs">問題：</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1863" y="1586.7" font-size="203.3" textLength="3125" lengthAdjust="spacingAndGlyphs">偉大的計畫往往需要眾多人手……但</tspan><tspan x="1865" y="1827.7" font-size="203.3" textLength="3112" lengthAdjust="spacingAndGlyphs">眾多人手通常導致大量的責任推卸。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1060" y="2379.7" font-size="278.3" textLength="3726" lengthAdjust="spacingAndGlyphs">當沒有人負責，就沒有人負責。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="705" y="3856.2" font-size="159.8" textLength="925" lengthAdjust="spacingAndGlyphs">我只是在市場</tspan><tspan x="701" y="4048.2" font-size="159.8" textLength="920" lengthAdjust="spacingAndGlyphs">上賣顧客要買</tspan><tspan x="867" y="4239.2" font-size="159.8" textLength="544" lengthAdjust="spacingAndGlyphs">的東西！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1873" y="3166.3" font-size="158.7" textLength="928" lengthAdjust="spacingAndGlyphs">我只是用薪水</tspan><tspan x="1870" y="3358.3" font-size="158.7" textLength="924" lengthAdjust="spacingAndGlyphs">買我買得起的</tspan><tspan x="2111" y="3548.8" font-size="158.7" textLength="390" lengthAdjust="spacingAndGlyphs">東西！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="4054" y="3532.2" font-size="159.8" textLength="1086" lengthAdjust="spacingAndGlyphs">我只是付給</tspan><tspan x="4145" y="3724.2" font-size="159.8" textLength="909" lengthAdjust="spacingAndGlyphs">工人由市場</tspan><tspan x="4370" y="3915.2" font-size="159.8" textLength="391" lengthAdjust="spacingAndGlyphs">決定的工資！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1136" y="5060.4" font-size="157.6" textLength="769" lengthAdjust="spacingAndGlyphs">我只是投給</tspan><tspan x="1134" y="5251.4" font-size="157.6" textLength="764" lengthAdjust="spacingAndGlyphs">比較不爛的</tspan><tspan x="1292" y="5443.9" font-size="157.6" textLength="392" lengthAdjust="spacingAndGlyphs">那個！</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="4022" y="4913.8" font-size="158.7" textLength="923" lengthAdjust="spacingAndGlyphs">我只是給選民</tspan><tspan x="4022" y="5106.3" font-size="158.7" textLength="877" lengthAdjust="spacingAndGlyphs">他們想要的。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="706" y="6349.9" font-size="169.6" textLength="4414" lengthAdjust="spacingAndGlyphs">舉例來說：2024 年，台灣的臉書動態充斥著 AI 生成的詐騙。</tspan><tspan x="707" y="6549.9" font-size="169.6" textLength="4409" lengthAdjust="spacingAndGlyphs">輝達（Nvidia）台灣裔執行長黃仁勳的擬真深偽影片，騙走了人</tspan><tspan x="706" y="6749.4" font-size="169.6" textLength="4483" lengthAdjust="spacingAndGlyphs">們數百萬美元。臉書的回應？「那則廣告不是我們做的；是我</tspan><tspan x="711" y="6950.4" font-size="169.6" textLength="3590" lengthAdjust="spacingAndGlyphs">們的演算法把它推送給你的。」毫無責任可言。</tspan></text><text font-family="sans-serif" fill-opacity="0"><tspan x="1132" y="7461.4" font-size="219.6" textLength="3584" lengthAdjust="spacingAndGlyphs">我只是聽命令／隨誘因／跟著大家走。</tspan></text></g></svg>
