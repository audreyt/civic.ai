<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5749 8000" width="1437" height="1999" lang="en-GB"><title>Pack 4: Responsiveness — Problem</title><desc>Hand-lettered comic page headed 'RESPONSIVENESS — PROBLEM': a rabbit holding a compass explains that society needs metrics to know where it is going but those metrics are often broken; paired charts contrast a rising 'average income' with the reality that income soars for the upper class while stalling for the lower class, and a table maps clicks to clickbait, comments to rage-bait flame wars, and user approval to sycophantic chatbots.</desc><style>@font-face{font-family:"Patrick Hand";src:url(/fonts/patrick-hand-comics.woff2) format("woff2");font-display:block}text{white-space:pre;font-variant-ligatures:none}</style><image href="/img/pack4-1-wordless-2874w.avif" width="5749" height="8000" preserveAspectRatio="none"/><image class="comic-lettering" href="/img/pack4-1-lettering.svg" width="5749" height="8000" preserveAspectRatio="none"/><g class="comic-text"><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1166" y="782.2" font-size="767.4" textLength="4411" lengthAdjust="spacingAndGlyphs">RESPONSIVENESS</tspan></text><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="377" y="1683.4" font-size="425.3" textLength="1329" lengthAdjust="spacingAndGlyphs">PROBLEM:</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="240.3" letter-spacing="9.3" fill="#FFFFFF"><text><tspan x="2526.5" y="1747">Like how navigators&#32;</tspan><tspan x="4442.3" y="1747">need a&#32;</tspan><tspan x="2526.2" y="2024.9">compass,&#32;</tspan><tspan x="3447.8" y="2024.9">society needs a way&#32;</tspan><tspan x="2526.3" y="2302.5">to measure&#32;</tspan><tspan x="3647.1" y="2302.5">where we're going.&#32;</tspan><tspan x="2525.8" y="2580.1">So, we use metrics! But alas,&#32;</tspan><tspan x="2526.4" y="2849.2">metrics are&#32;</tspan><tspan x="3703" y="2849.2">often broken.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="400.4" y="3514.3">For example, policymakers&#32;</tspan><tspan x="400.3" y="3725.2">may say that &quot;</tspan><tspan x="1392.1" y="3725.2">average&#32;</tspan><tspan x="400.4 443.3 528.8 604 681.2 811.3 881.4 945.4 989.4 1032.3 1106 1150 1226.5 1308.4 1349.4 1389.3" y="3936.1">income” is up...</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="2450.5" y="3514.2">...but&#32;</tspan><tspan x="2859.7" y="3513.2">&quot;</tspan></text><text transform="matrix(1 0 -0.3 1 1054.3 0)"><tspan x="2909.7" y="3514.2">average</tspan></text><text><tspan x="3472.6" y="3513.2">&quot;&#32;</tspan><tspan x="3590.6" y="3514.2">hides&#32;</tspan><tspan x="3981.4" y="3514.2">the fact that&#32;</tspan><tspan x="4906" y="3514.2">income&#32;</tspan><tspan x="2474.4" y="3726.2">is&#32;</tspan><tspan x="2634" y="3726.2">way up for the upper classes, while&#32;</tspan><tspan x="2450.5" y="3937.7">stalling&#32;</tspan><tspan x="3024.5" y="3937.7">or falling&#32;</tspan><tspan x="3722.6" y="3937.7">for the lower classes.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.3" fill="#000000"><text><tspan x="3035.8" y="5732.6">Likewise, the algorithms &amp; AIs&#32;</tspan><tspan x="3035.7" y="5943.3">that run&#32;</tspan><tspan x="3648.3" y="5943.3">modern media --&#32;</tspan><tspan x="4850.7" y="5943.3">and&#32;</tspan><tspan x="3036.7" y="6154.3">thus run modern culture &amp;&#32;</tspan><tspan x="3036.2" y="6365.1">politics --&#32;</tspan><tspan x="3787.1" y="6365.1">use&#32;</tspan><tspan x="4058.4" y="6365.1">metrics with&#32;</tspan><tspan x="3036" y="6575.7">famous failures.</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="287.7" fill="#000000"><text><tspan x="717.3" y="5935.2">Metric</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="287.4" fill="#000000"><text><tspan x="1829.6" y="5915.5">Failure</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="154.6" letter-spacing="18.6" fill="#000000"><text><tspan x="986.3" y="6365.1">clicks</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="154.1" letter-spacing="9.2" fill="#000000"><text><tspan x="1857.3" y="6317.3">clickbait</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="153.1" fill="#000000"><text><tspan x="937.3" y="6796.3">comments</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="153.7" letter-spacing="9.3" fill="#000000"><text><tspan x="1866.9" y="6710">rage-bait&#32;</tspan><tspan x="1866.8" y="6863.6">flame wars</tspan></text></g><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="154.6" letter-spacing="9.1" fill="#000000"><text><tspan x="956.7" y="7189.1">user&#32;</tspan><tspan x="956.1" y="7342.6">approval</tspan></text></g><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="1856" y="7159.1" font-size="135.8" textLength="736" lengthAdjust="spacingAndGlyphs">sycophantic&#32;</tspan><tspan x="1852" y="7293.5" font-size="143.2" textLength="531" lengthAdjust="spacingAndGlyphs">chatbots</tspan></text><text font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" fill-opacity="0"><tspan x="2600" y="7469.8" font-size="201.1" textLength="317" lengthAdjust="spacingAndGlyphs">etc</tspan></text><g font-family="'Patrick Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="191.4" fill="#000000"><text><tspan x="3199.5" y="6939.4">So how can&#32;</tspan><tspan x="3977.6" y="6939.4">we measure what we&#32;</tspan><tspan x="3199.4" y="7150.9">value --&#32;</tspan><tspan x="3796.4" y="7150.9">our &quot;compass&quot; --</tspan><tspan x="3199.4" y="7361.2">without&#32;</tspan><tspan x="3739.8" y="7361.2">being&#32;</tspan><tspan x="4152.4" y="7361.2">mislead?</tspan></text></g></g></svg>
