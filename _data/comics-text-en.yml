              text: "* This orange story grew from Follett (1925), Fisher & Ury (1981), and Covey (1989)."
    Ch5_B:
        boxes:
            - id: header-not
              role: hand_sc
              box: [280, 256, 5532, 590]
              text: "not: mutually assured destruction"
            - id: header-but
              role: hand_sc
              box: [280, 600, 5532, 920]
              text: "but: as win-win as possible"
            - id: solution-label
              type: lettering
              box: [320, 1312, 1780, 1792]
              text: "SOLUTION:"
            - id: solution
              box: [1880, 1300, 5284, 2004]
              text: |-
                  Take a step back. Behind the WHAT you want, ask
                  yourselves: WHY do you want it? Then: can you
                  create a new WHAT that fulfils both your WHYs?
              emphasis: [{ text: both, italic: true }]
            - id: example
              box: [376, 2028, 2788, 2520]
              text: |-
                  For example, maybe our two chefs
                  say to each other...
            - id: liqueur-bubble
              box: [1060, 2728, 1864, 3080]
              text: |-
                  I need to make
                  orange liqueur.
            - id: juice-bubble
              box: [1280, 3256, 1964, 3612]
              text: |-
                  Oh! I need
                  orange juice.
            - id: realise
              box: [2976, 2028, 5392, 2520]
              text: |-
                  ...and they realise, they can both
                  get 100% of their needs, no waste!
            - id: peels-label
              box: [3676, 2680, 4388, 3066]
              text: |-
                  peels & zest
                  for liqueur
            - id: pulp-label
              box: [4160, 3070, 4652, 3448]
              text: |-
                  pulp for
                  juice
            - id: time-zone
              box: [380, 4392, 2788, 5548]
              text: |-
                  Yes, that’s contrived, but win-wins
                  can often be found in real life! A
                  few years back, Taiwan had an
                  angry debate about whether to
                  change its time zone:
            - id: change
              box: [552, 5732, 1084, 6616]
              text: |-
                  CHANGE:
                  to make
                  Taiwan
                  more
                  unique
            - id: keep
              box: [1904, 5720, 2736, 6604]
              text: |-
                  KEEP:
                  because time
                  zone change is
                  economically
                  costly
            - id: gold-card
              box: [2956, 4424, 5392, 5492]
              text: |-
                  But with the help of pol.is and
                  participation officers, folks found
                  a new WHAT to fulfil mutual WHYs:
                  the Gold Card residency, to bring
                  scientists & artists to Taiwan.
              emphasis: [{ text: pol.is, italic: true }]
            - id: for
              box: [3348, 5804, 3592, 5988]
              text: for
            - id: uniqueness
              box: [3084, 6068, 3856, 6248]
              text: UNIQUENESS
            - id: and
              type: lettering
              box: [3324, 6308, 3680, 6612]
              text: and
            - id: economics
              box: [3116, 6660, 3832, 6840]
              text: ECONOMICS
            - id: question-marks
              box: [3352, 6932, 3588, 7116]
              text: "???"
            - id: welcome-sign
              type: lettering
              box: [4276, 5832, 5140, 6324]
              text: |-
                  welcome,
                  Creators!
            - id: closing
              tracking: false
              box: [1052, 7404, 4908, 7712]
              text: That’s how better discussion can help us get to win-win!
              emphasis: [{ text: That’s, italic: true }]
    Ch6_A:
        boxes:
            - id: title
              type: lettering
              box: [1204, 176, 5620, 980]
              text: SYMBIOSIS
            - id: problem-label
              type: lettering
              box: [336, 1332, 1748, 1820]
              text: "PROBLEM:"
            - id: problem
              tracking: false
              box: [1852, 1400, 5316, 1768]
              text: Don’t put all your society in one basket.
            - id: platforms
              box: [452, 2004, 2750, 2920]
              text: |-
                  Our modern culture & news &
                  politics all go through a handful
                  of platforms run by a few
                  multinational companies.
            - id: single-point
              box: [2992, 2004, 5240, 2916]
              text: |-
                  But this creates a single point
                  of failure! Whether by accident
                  or deliberate greed, these
                  platforms can fail us.
            - id: success
              box: [484, 5468, 5312, 6140]
              text: |-
                  And even when centralised platforms don’t fail ,“success” is still bad:
                  a bland, one-size-fits-all culture, with no “thick middle layer” of
                  churches, local communities, and so on.
              emphasis: [{ text: still, italic: true }]
    Ch6_B:
        boxes:
            - id: header-not
              role: hand_sc
              box: [188, 260, 5576, 590]
              text: "not: one-size-fits-all overlord"
            - id: header-but
              role: hand_sc
              box: [188, 600, 5576, 912]
              text: "but: local solutions for local folks"
            - id: solution-label
              type: lettering
              box: [320, 1312, 1780, 1792]
              text: "SOLUTION:"
            - id: solution
              box: [1864, 1356, 5440, 1888]
              text: |-
