              text: clicks
            - id: clickbait
              box: [1822, 6165, 2440, 6360]
              text: clickbait
            - id: comments
              box: [900, 6645, 1545, 6840]
              text: comments
            - id: rage-bait
              box: [1830, 6560, 2595, 6905]
              text: |-
                  rage-bait
                  flame wars
            - id: user-approval
              box: [920, 7078, 1540, 7430]
              text: |-
                  user
