# The English lettering of Nicky Case's comics, as the site shows it.
#
# Source for scripts/comics-vector.mjs, which fits each box to the print
# masters of https://github.com/ncase/civic-ai-comics and writes img/*.svg.
# The schema follows that repository's compact text spec
# (translation-assets/zh-TW.yml): coordinates are pixels of the 5749 x 8000
# print canvas, boxes are listed in reading order, and `emphasis` spans pick
# out text by `text` (and `occurrence`) or by `start`/`end`.
#
#   type: text (default)  typeset in `role`; becomes live SVG text
#         lettering       drawn by hand; traced to outlines, its words
#                         carried as invisible text over the drawing
#   role: hand (Patrick Hand, default) | hand_sc (Patrick Hand SC) | anton
#   box:  [x0, y0, x1, y1] enclosing the box's ink and nothing else
#   font: optional size override in canvas pixels
#   emphasis: [{ text, italic: true }] for the synthetic-oblique words
#
# Where the site's images carry later copy edits than the masters, the text
# here follows the site.
schema: 1
pages:
    Overview:
        boxes:
            - id: listen-title
              role: anton
              box: [960, 288, 2368, 772]
              text: |-
                  ACTUALLY
                  LISTEN TO PEOPLE
            - id: listen
              box: [740, 1892, 2508, 2316]
              text: |-
                  not: only the popular/powerful
                  but: small underdogs too
            - id: promises-title
              role: anton
              box: [3492, 304, 4756, 788]
              text: |-
                  ACTUALLY
                  KEEP PROMISES
            - id: promises
              box: [3156, 1804, 5060, 2360]
              text: |-
                  not: vague ideals, soon abandoned
                  but: specific commitments,
                  with teeth
            - id: process-title
              role: anton
              box: [1128, 2769, 2157, 3208]
              text: |-
                  WE CHECK
                  THE PROCESS
            - id: process
              box: [900, 4216, 2344, 4824]
              text: |-
                  not: “just trust us lol”
                  but: transparency & fast
                  community feedback
            - id: results-title
              role: anton
              box: [3600, 2756, 4640, 3240]
              text: |-
                  WE CHECK
                  THE RESULTS
            - id: results
              box: [3200, 4160, 5020, 4896]
              text: |-
                  not: metrics that don’t measure
                  what we value
                  but: metrics designed by
                  & for us
            - id: win-win-title
              role: anton
              box: [1148, 5228, 2176, 5712]
              text: |-
                  AS WIN-WIN
                  AS POSSIBLE
            - id: win-win
              box: [676, 6728, 2600, 7284]
              text: |-
                  not: mutually assured destruction
                  but: deals where all sides
                  are better off
            - id: local-title
              role: anton
              box: [3596, 5228, 4628, 5712]
              text: |-
                  AS LOCAL
                  AS POSSIBLE
            - id: local-not
              box: [3168, 6700, 5052, 6870]
              text: "not: a one-size-fits-all Overlord"
            - id: local-but
              box: [3168, 6875, 5052, 7372]
              text: |-
                  but: a variety of solutions
                  by & for a variety
                  of folks
