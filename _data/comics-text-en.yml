                      { text: nobody, italic: true },
                  ]
            - id: enlightenment
              role: oswald
              box: [3865, 6375, 5295, 7545]
              text: |-
                  Enlightenment is not
                  self-awareness but self-
                  unawareness. To be a
                  mind so vast, even It can
                  no longer speak Its own
                  true name.
